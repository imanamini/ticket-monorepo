<div class="header-remaining">

  <span *ngIf="hasDescription">زمان باقی‌مانده&nbsp;&nbsp;</span>
  <span *ngIf="(formattedMinutes && formattedSeconds); else loader">
    {{ formattedMinutes }}:{{ formattedSeconds }}</span>
  <ng-template #loader>
    <div class="loader"></div>
  </ng-template>

</div>
