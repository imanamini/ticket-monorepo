<header class="d-flex flex-row align-items-center gap-small pt-pony pb-pony pl-medium pr-medium ">
  <div class="action mt-tiny" (click)="goToDashboard()"></div>
  <span class="t-6 text-onback-medium">بازپرداخت تسهیلات اعطا شده</span>
</header>

<div class="under-construction d-flex flex-column mt-hulk mb-big ml-medium mr-medium">
  <ngx-status-result
    class="mb-auto"
    [title]="'در دست توسعه'"
    [description]=" 'به زودی این صفحه برای استفاده در دسترس شما قرار خواهد گرفت.'"
    [subDescription]="'تاریخ بازپرداخت وام شما ۳ ماه پس از دریافت آن است. تا آن زمان، این صفحه نیز به‌طور کامل توسعه یافته و آماده استفاده خواهد شد.'"
    [buttons]="[{
        id: 'primary',
        buttonMode: 'curved',
        buttonStyle: 'tinted',
        label: 'متوجه شدم!'
      }]"
    (clicked)="goToDashboard()"
  >
    <ng-container status-image>
      <img src="assets/icons/under-construction-illustration.svg" alt="under-construction">
    </ng-container>
  </ngx-status-result>
  <div class="support-wrapper d-flex justify-content-space-between mt-small  p-medium radius-minus">
    <span class="name">شماره پشتیبانی:</span>
    <span class="phone">۰۲۱-۵۳۹۲۴۰۰۰ (داخلی۶)</span>
  </div>
</div>
