<ui-content-card cardTitle="افتتاح حساب آنلاین"
                 [backArrow]="true"
                 (backClicked)="backToOverview()"
                 [contentPadding]="false">

  <ng-container card-body *ngIf="!inProgressAction">
    <div class="loading-wrapper">
      <ui-spinner></ui-spinner>
    </div>
  </ng-container>
  <ng-container card-body *ngIf="inProgressAction">

    <progressive-flow
      *ngIf="actionToStepIndex[inProgressAction] >= 0"
      [stepIndex]="actionToStepIndex[inProgressAction]"
      [stepTitles]="stepTitles">

      <div *progressContent>
        <ng-container [ngSwitch]="inProgressAction">
          <account-upload-documents *ngSwitchCase="openBankActionEnum.UPLOAD_STEP" [files]="files"
                                    (nextStep)="uploadDocuments()"></account-upload-documents>
          <account-confirm-info *ngSwitchCase="openBankActionEnum.OVERVIEW_STEP"
                                (nextStep)="getState()"></account-confirm-info>
        </ng-container>
      </div>

    </progressive-flow>

    <div class="data-sent" *ngIf="inProgressAction === openBankActionEnum.SUCCESS">
      <ngx-status-result
        class="status-result"
        [title]="'اطلاعات شما برای افتتاح حساب به بانک خاورمیانه ارسال شد'"
        [description]="'بعد از تایید افتتاح حساب، برای امضای قرارداد و اتمام فرآیند ثبت‌نام، از طریق پیامک به شما اطلاع خواهیم داد.'"
        [buttons]="[{
      id: 'primary',
      buttonMode: 'default',
      buttonStyle: 'tinted',
      label: 'متوجه شدم'
    }]"
        (clicked)="backToOverview()"
      >
        <ng-container status-image>
          <img src="assets/icons/bank-illustration.svg" alt="">
        </ng-container>
      </ngx-status-result>
    </div>
    <div class="data-sent" *ngIf="inProgressAction === openBankActionEnum.NEXT_STEP">
      <ngx-status-result
        class="status-result"
        [title]="'احراز هویت و افتتاح حساب شما با موفقیت پایان یافت'"
        [description]="'افتتاح حساب شما انجام شد. با تایید و امضای قراردادها، فرآیند ثبت‌نام خود را تکمیل کنید.'"
        [buttons]="[{
      id: 'primary',
      buttonMode: 'default',
      buttonStyle: 'tinted',
      label: 'متوجه شدم'
    }]"
        (clicked)="backToOverview()"
      >
        <ng-container status-image>
          <img src="assets/icons/success-illustration.svg" alt="">
        </ng-container>
      </ngx-status-result>
    </div>
    <div class="data-sent" *ngIf="inProgressAction === openBankActionEnum.REJECTED">

      <ngx-status-result
        class="status-result"
        [title]="'اشکال در فرآیند افتتاح حساب'"
        [description]="'در افتتاح حساب مشکلی پیش آمده است. لطفا برای اطلاعات بیشتر با پشتیبانی تماس بگیرید.'"
        [buttons]="[{
      id: 'primary',
      buttonMode: 'default',
      buttonStyle: 'tinted',
      label: 'متوجه شدم'
    }]"
        (clicked)="backToOverview()"
      >
        <ng-container status-image>
          <img src="assets/icons/error-illustration.svg" alt="">
        </ng-container>
      </ngx-status-result>
    </div>

    <div class="data-sent" *ngIf="inProgressAction === openBankActionEnum.GETTING_DOCUMENT">

      <div class="getting-documents-illustration"></div>
      <h3>
        در حال دریافت اطلاعات هویتی شما هستیم
      </h3>
      <div class="progress-bar">
        <progress-bar-loading></progress-bar-loading>
      </div>
    </div>

  </ng-container>

  <!--  <ng-container-->
  <!--    card-footer-->

  <!--  >-->
  <!--    <ui-button (clicked)="backToOverview()" class="primary-action">-->
  <!--      متوجه شدم-->
  <!--    </ui-button>-->
  <!--  </ng-container>-->

</ui-content-card>
