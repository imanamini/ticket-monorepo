<div class="info-card" (click)="clickCard(branchInfo)">
  <div class="content">
    <div class="location">
      <div class="location-icon"></div>
    </div>
    <div>
      <h3 class="title">{{ branchInfo.title }}</h3>
      <span class="address">{{ branchInfo.address }}</span>
    </div>
  </div>
  <div class="arrow-icon"></div>
</div>
