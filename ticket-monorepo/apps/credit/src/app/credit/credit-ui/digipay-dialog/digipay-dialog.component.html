<div class="digipay-dialog">
  <h3 mat-dialog-title *ngIf="title">{{title}}</h3>
  <div mat-dialog-content>
    <ng-content></ng-content>
  </div>
  <div mat-dialog-actions *ngIf="confirmText || rejectText">
    <button mat-button *ngIf="confirmText" (click)="confirmButtonClick()" class="resolve">
      {{confirmText}}
    </button>
    <button mat-button *ngIf="rejectText" (click)="rejectClick()" class="reject">
      {{rejectText}}
    </button>
  </div>
</div>
