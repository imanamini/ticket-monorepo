<!doctype html>

>
  <head>

      window.digipayHybridApp.setContact = function () {};
      window.digipayHybridApp.setDynamicPassword = function () {};
      window.digipayHybridApp.setGPSStatus = function () {};
      window.digipayHybridApp.setBiometricResult = function () {};
    </script>
    <meta charset="utf-8" />
    <title>دیجی‌پی | خدمات مالی و پرداخت</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0"
    />
    <meta
      name="format-detection"
      content="telephone=no"
    />
    <meta
      name="color-scheme"
      content="light"
    />
    <meta
      name="supported-color-schemes"
      content="light"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta
      http-equiv="Pragma"
      content="no-cache"
    />
    <meta
      http-equiv="Expires"
      content="0"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico"
    />
    <style>
      body {
        position: relative;
        height: 100dvh;
        width: 100svw;
        margin: 0;
      }
    </style>
    <script>
      var now = Date.now();

      // Function to safely check if localStorage is available
      function isLocalStorageAvailable() {
        try {
          const test = '__localStorage_test__';
          localStorage.setItem(test, test);
          localStorage.removeItem(test);
          return true;
        } catch (e) {
          return false;
        }
      }

      // Function to safely get from localStorage
      function safeGetLocalStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          console.warn('localStorage access denied:', e);
          return null;
        }
      }

      // Function to safely set to localStorage
      function safeSetLocalStorage(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          console.warn('localStorage write denied:', e);
          return false;
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        if (isLocalStorageAvailable()) {
          const splashTime = safeGetLocalStorage('splashTime');
          if (!splashTime) {
            showSplash();
          } else {
            if (now - parseInt(splashTime) > 60 * 60 * 1000) {
              showSplash();
            }
          }
        } else {
          showSplash();
        }
      });

      const showSplash = function () {
        try {
          if (document.getElementById('nativeSplash')) {
            document.getElementById('nativeSplash').style.display = 'flex';
          }
          if (document.getElementById('angularSplash')) {
            document.getElementById('angularSplash').style.display = 'flex';
          }
        } catch (e) {
          console.warn(e);
        }

        // Safely store the splash time
        if (isLocalStorageAvailable()) {
          safeSetLocalStorage('splashTime', now.toString());
        }
      };
    </script>
    <link
      rel="manifest"
      href="manifest.webmanifest"
    />
    <meta
      name="theme-color"
      content="#005DFF"
    />
    <script>
      // iOS webview detection and service worker fix
      (function () {
        var isIOSWebView = function () {
          var ua = window.navigator.userAgent.toLowerCase();
          var isIOS = /iphone|ipod|ipad/.test(ua);
          var isWebView = !window.navigator.standalone && !/safari/.test(ua);
          return isIOS && (isWebView || window.webkit);
        };

        var clearServiceWorkerCache = function () {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              registrations.forEach(function (registration) {
                registration.unregister();
              });
            });

            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) {
                  caches.delete(name);
                });
              });
            }
          }
        };

        // Check if we're in iOS webview
        if (isIOSWebView()) {
          console.log('iOS WebView detected');

          // Check for force refresh flag
          var shouldForceRefresh = safeGetLocalStorage('dpx_force_refresh');
          if (shouldForceRefresh === 'true') {
            console.log('Force refresh requested, clearing caches');
            clearServiceWorkerCache();
            safeSetLocalStorage('dpx_force_refresh', 'false');
          }

          // Store iOS webview flag for later use
          window.__IS_IOS_WEBVIEW__ = true;
        }
      })();
    </script>
  </head>
  <body
    class="light surface-back no-select"
    id="body"
  >
    <dpx-root></dpx-root>
  </body>
