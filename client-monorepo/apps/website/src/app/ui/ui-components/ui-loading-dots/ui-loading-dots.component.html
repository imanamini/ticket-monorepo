<div
  [style.fontSize]="size + 'px'"
  class="dots"
>
  <span
    [ngStyle]="{
      opacity: active === 1 ? 1 : opacity,
      backgroundColor: color,
    }"
    class="dot"
  ></span>
  <span
    [ngStyle]="{
      opacity: active === 2 ? 1 : opacity,
      backgroundColor: color,
    }"
    class="dot center"
  ></span>
  <span
    [ngStyle]="{
      opacity: active === 3 ? 1 : opacity,
      backgroundColor: color,
    }"
    class="dot"
  ></span>
</div>
