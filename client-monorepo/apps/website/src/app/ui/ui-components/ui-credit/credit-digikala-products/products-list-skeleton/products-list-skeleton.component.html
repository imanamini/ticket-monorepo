<div class="skeleton-container">
  <ng-container *ngFor="let item of productSkeletonList">
    <div class="single-product-skeleton">
      <div class="image-skeleton"></div>
      <div class="content-skeleton">
        <div class="row">
          <div class="long"></div>
          <div class="short"></div>
        </div>
        <div class="row">
          <div class="short"></div>
          <div class="long"></div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
