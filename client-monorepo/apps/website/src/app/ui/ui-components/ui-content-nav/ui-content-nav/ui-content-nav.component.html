<section class="section-content-nav">
  <div class="container">
    <h2
      *ngIf="data.title"
      class="text-align-center"
    >
      {{ data.title }}
    </h2>
    <div
      *ngIf="data.subtitle"
      class="subtitle text-align-center"
    >
      {{ data.subtitle }}
    </div>

    <div class="business-services__contain">
      <div class="business-content">
        <div class="business-services__nav">
          <div class="swiper-navigation">
            <div class="horizontal-flow-navigation">
              <div
                class="horizontal-flow-button-next"
                (click)="swiper.slideNext()"
              >
                <i class="horizontal-flow-icon__arrow-right"></i>
              </div>
              <div
                class="horizontal-flow-button-prev"
                (click)="swiper.slidePrev()"
              >
                <i class="horizontal-flow-icon__arrow-left"></i>
              </div>
            </div>
          </div>

          <swiper-container
            appSwiper
            #swiper="appSwiper"
            [config]="configNav"
            [id]="'business-services-options'"
          >
            <swiper-slide *ngFor="let item of data?.services; let itemIndex = index">
              <div
                (click)="changeTab(itemIndex + 1)"
                [ngClass]="activeIndex === itemIndex + 1 ? 'active' : ''"
              >
                <div class="business-services__nav-icon">
                  <div>
                    <img
                      [alt]="item.shortDetails.title"
                      [src]="item.shortDetails.icon.url"
                    />
                  </div>
                </div>
                <div class="business-services__nav-titles">
                  <div>
                    <div class="business-services__nav-title">
                      <span>{{ item.shortDetails.title }}</span>
                    </div>
                    <div class="business-services__nav-subtitle">
                      <span>{{ item.shortDetails.text }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </swiper-slide>
          </swiper-container>

          <!--          <swiper [config]="configNav" [id]="'business-services-options'">-->

          <!--              *ngFor="let item of data?.services; let itemIndex = index"-->

          <!--              </ng-template>-->
          <!--            </ng-container>-->
          <!--          </swiper>-->
        </div>
        <div class="business-services__blocks">
          <ul id="business-services-contents">
            <ng-container *ngFor="let item of data?.services; let itemIndex = index">
              <li
                *ngIf="activeIndex === itemIndex + 1"
                class="business-services-content"
              >
                <article>
                  <div>
                    <div class="title">{{ item.fullDetails.title }}</div>
                    <ul
                      *ngIf="item.features.length > 0"
                      class="business-services-features"
                    >
                      <ng-container *ngFor="let feature of item.features">
                        <li>
                          <i class="icon-check-yellow"></i>
                          {{ feature.title }}
                        </li>
                      </ng-container>
                    </ul>
                    <p class="justified">
                      {{ item.fullDetails.text }}
                    </p>
                    <app-ui-button
                      *ngIf="item.moreInfo.link"
                      [link]="item.moreInfo.link"
                      >{{ item.moreInfo.title }}
                    </app-ui-button>
