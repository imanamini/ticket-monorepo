<div class="payment-result">
  <div
    [style.backgroundColor]="backgroundColor"
    class="page-header"
  >
    <!--    <h1 class="payment-status">{{result.status}}</h1>-->
    <div class="result-header">
      <h2 class="subtitle">{{ result.title }}</h2>
      <h3 class="amount">
        <app-ui-currency
          [fontSize]="'20px'"
          [value]="result.amount"
          unitFontSize="12px"
        ></app-ui-currency>
      </h3>

      <span class="icon">
        <ui-api-image
          *ngIf="result.imageId"
          [imageId]="result.imageId"
          [styles]="{ borderRadius: '50%' }"
          height="100%"
          width="100%"
        ></ui-api-image>
        <span
          *ngIf="!result.imageId"
          class="default-icon"
        ></span>
      </span>
    </div>
  </div>
  <div class="page-body">
    <div class="activities">
      <ul class="list">
        <li *ngFor="let detail of result.activityInfo">
          <span class="label">{{ detail.key }}</span>
          <span
            (click)="copyToClipboard(detail)"
            [ngClass]="{ 'is-copyable': detail.copyable }"
            class="value"
            >{{ detail.value }}</span
          >
        </li>
      </ul>
      <div
        *ngIf="message"
        class="message"
      >
        <div
          [innerHTML]="message"
          class="html"
        ></div>
      </div>
    </div>
    <div class="child-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
