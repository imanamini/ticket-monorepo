<div class="services__intro-right">
  <div>
    <ul
      [ngClass]="{ act: act }"
      class="services__intro-right_mockup-x"
    >
      <li class="services__intro-right_mockup-x-item">
        <div
          *ngFor="let image of images; let i = index"
          [ngClass]="{ show: visibleImageIndex.includes(i) }"
          [ngStyle]="{ backgroundImage: 'url(' + image.image.url + ')' }"
        ></div>
      </li>
    </ul>
  </div>
</div>
