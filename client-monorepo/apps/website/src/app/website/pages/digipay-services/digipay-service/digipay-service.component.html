<app-base-layout [loaded]="loaded">
  <!--  section 1-->
  <app-dp-service-intro [templateData]="templateData"></app-dp-service-intro>

  <!--  section 2-->
  <app-ui-value-section
    *ngIf="templateData && templateData.services"
    [data]="templateData ? templateData.services : []"
  ></app-ui-value-section>

  <!--  section 3-->
  <app-ui-flow [flow]="templateData?.flow"></app-ui-flow>

  <!--  section 4-->
  <app-ui-faq
    *ngIf="templateData && templateData.faq"
    [faqs]="templateData.faq.faqItems"
    [subtitle]="templateData.faq.subtitle"
    [title]="templateData.faq.title"
  >
  </app-ui-faq>

  <!--  section 5-->
  <app-ui-similar-services
    *ngIf="templateData && templateData.similar && templateData.similar.items && templateData.similar.items.length > 0"
    [data]="templateData.similar"
  ></app-ui-similar-services>

  <!--  section 6-->
  <app-blog-cards
    *ngIf="posts.length > 0"
    [blogPosts]="posts"
    [subtitle]="templateData?.relatedPosts?.subtitle"
    [title]="templateData?.relatedPosts?.title"
  ></app-blog-cards>
</app-base-layout>
