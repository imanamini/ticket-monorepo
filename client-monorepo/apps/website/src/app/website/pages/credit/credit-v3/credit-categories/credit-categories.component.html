<section>
  <div class="container">
    <swiper-container
      appSwiper
      #swiper
      [config]="config"
      (slidechange)="slideChange($event)"
    >
      <swiper-slide *ngFor="let category of creditCategoriesData.creditCategories">
        <div
          *ngIf="category.icon && category.title"
          class="item"
        >
          <img
            [alt]="category.icon.altText"
            [src]="category.icon.url"
          />
          <span>{{ category.title }}</span>
        </div>
      </swiper-slide>
    </swiper-container>
