<div class="credit-onsite-registration-section text-oninvert-high">
  <div class="container">
    <div class="st-1 text-align-center">{{ data().title }}</div>

    <div class="credit-onsite-registration-row">

      @for (item of data().valuePropositions; track $index) {
        <div class="onsite-col">
          <img [ngSrc]="item.image.url" width="80" height="80" [alt]="item.image.altText">

          <div class="onsite-col-title mt-medium">{{ item.text }}</div>
        </div>
      }
    </div>

    <div class="bt-1 text-align-center description" [innerHTML]="data().description">
    </div>

    <div class="d-flex justify-content-center mt-large">
      <ngx-button
        [mode]="'section'"
        [size]="deviceDetector.isMobileDevice() ?  'medium' :'large'"
        [style]="'tinted-on-back'"
        [rightIcon]="{
          name: 'location',type: 'bold'
        }"
        (clickHandler)="openLink(data().button.link)"
      >{{ data().button.title }}
      </ngx-button>
    </div>
  </div>
</div>
