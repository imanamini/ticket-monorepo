<section class="product-lists">
  <div class="container">
    <h1 class="text-align-center">{{ templateData?.products?.title }}</h1>
    <div class="subtitle text-align-center">
      {{ templateData?.products?.subtitle }}
    </div>
    <div class="product-lists__contain">
      <div>
        <div class="swiper-navigation">
          <div class="horizontal-flow-navigation">
            <div
              class="horizontal-flow-button-prev"
              (click)="swiper.slidePrev()"
            >
              <i class="horizontal-flow-icon__arrow-right"></i>
            </div>
            <div
              class="horizontal-flow-button-next"
              (click)="swiper.slideNext()"
            >
              <i class="horizontal-flow-icon__arrow-left"></i>
            </div>
          </div>
        </div>
        <swiper-container
          appSwiper
          #swiper="appSwiper"
          [config]="config"
        >
          <swiper-slide *ngFor="let item of templateData?.products?.productLists">
            <div>
              <a
                [href]="item.link"
                target="_blank"
              ></a>
              <div>
                <div class="product-lists__image">
                  <div>
                    <img
                      [src]="item?.image?.url"
                      alt=""
                    />
                  </div>
                </div>
                <div class="product-lists__title">
                  <div>
                    {{ item.title }}
                  </div>
                </div>
                <div class="product-lists__prices">
                  <div>
                    <div class="product-lists__price-list">
                      <div>
                        <div class="product-lists__new-price">
                          <div>
                            <span>قیمت</span>
                          </div>
                          <div>
                            <b>{{ item.price }}</b>
                            <span>تومان</span>
                          </div>
                        </div>
                        <div
                          *ngIf="item.cashBack"
                          class="product-lists__gift-price"
                        >
                          <div>
                            <svg
                              fill="none"
                              height="16"
                              viewBox="0 0 12 16"
                              width="12"
                              xmlns="http://www.w3.org/2000/svg"
                            >
                              <path
                                clip-rule="evenodd"

                                fill="#00CC65"
                                fill-rule="evenodd"
                              ></path>
                            </svg>
                            <span>هدیه نقدی</span>
                          </div>
                          <div>
                            <b>{{ item.cashBack }}</b>
                            <span>تومان</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </swiper-slide>
        </swiper-container>
      </div>
    </div>
  </div>
</section>
