<section class="section-working-capital-wrapper">
  <div class="container">
    <div class="content">
      <h1>دریافت وام برای فروشندگان</h1>
      <div class="subtitle">با یک کلیک در وب سایت دیجی پی</div>
    </div>
  </div>
  <div class="form">
    <app-ui-section>
      <ng-container *ngIf="!loading">
        <div
          *ngIf="state === 'CALCULATOR'"
          class="banner"
        >
          <div>
            <h3>سقف وام خود را</h3>
            <h3>تا ۲ میلیارد تومان افزایش دهید!</h3>
          </div>
          <a
            (click)="errorType.emit('NOT_EXIST')"
            class="cursor-pointer"
            >ثبت درخواست</a
          >
        </div>
        <div class="text-align-center title">
          {{ dataMapper[state].title }}
        </div>
        <ng-container [ngSwitch]="state">
          <app-working-capital-form *ngSwitchCase="'FORM'"></app-working-capital-form>
          <app-working-capital-not-exist
            *ngSwitchCase="'NOT_EXIST'"
            [error]="error"
          ></app-working-capital-not-exist>
          <app-working-capital-calculator
            (error)="updateError($event)"
            *ngSwitchCase="'CALCULATOR'"
            [creditAmount]="maxLoan"
          ></app-working-capital-calculator>
        </ng-container>
      </ng-container>
      <app-ui-spinner
        *ngIf="loading"
        size="24"
      ></app-ui-spinner>
    </app-ui-section>
  </div>
</section>
