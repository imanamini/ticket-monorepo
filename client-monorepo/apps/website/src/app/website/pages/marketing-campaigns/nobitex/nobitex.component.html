<app-base-layout
  *ngIf="creditCampaignPage && creditCampaignPage.templateData"
  [loaded]="loaded"
>
  <ng-container *ngIf="(this.nobitexCredit.submittedNobitexCreit$ | async) === false">
    <div class="nobitex-container">
      <app-credit-campaign-timer
        class="campaign-timer"
        [block]="'start'"
        [scrollAnchor]="'custom-form'"
        [scrollToElementId]="'register-benefits'"
        [templateData]="creditCampaignPage.templateData"
        [withoutHref]="false"
        (clickEmit)="showNobitexStepper()"
      ></app-credit-campaign-timer>
      <div class="section-registering">
        <div class="container">
          <app-credit-register-benefits
            [registerBenefitsData]="digiPayBenefit"
            class="register-benefits"
            id="register-benefits"
          ></app-credit-register-benefits>
        </div>
      </div>

      <div
        class="nobitex-plans"
        *ngIf="nobitexCredit.estimate$ | async"
        id="nobitexPlans"
      >
        <ng-container
          *ngIf="(nobitexCredit.estimate$ | async) && (nobitexCredit.amount$ | async) / 1.32 >= nobitexCredit.nobitexCalculator.startAmount"
        >
          <span class="nobitex-plans-title"> مبلغ اعتبار را مشخص کنید </span>
          <app-nobitex-calculator
            [calculator]="nobitexCalculator"
            [amount]="nobitexCredit.amount$ | async"
            [image]="creditCampaignPage.templateData.sectionCounter.image"
          ></app-nobitex-calculator>
        </ng-container>
        <ng-container
          *ngIf="(nobitexCredit.estimate$ | async) && (nobitexCredit.amount$ | async) / 1.32 < nobitexCredit.nobitexCalculator.startAmount"
        >
          <app-nobitex-no-plan></app-nobitex-no-plan>
        </ng-container>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="this.nobitexCredit.submittedNobitexCreit$ | async">
    <app-nobitex-submitted id="nobitex-submited"></app-nobitex-submitted>
    <app-c-bnpl-stores
      *ngIf="creditCampaignPage.templateData.cBnplStores"
      [cBnplStores]="creditCampaignPage.templateData.cBnplStores"
      id="stores-component"
    ></app-c-bnpl-stores>
  </ng-container>

  <ng-container>
    <app-ui-horizontal-flow
      *ngIf="creditCampaignPage.templateData.sectionOnboarding && creditCampaignPage.templateData.sectionOnboarding.values.length > 0"
      [steps]="creditCampaignPage.templateData.sectionOnboarding.values"
      [title]="creditCampaignPage.templateData.sectionOnboarding.title"
      id="section-flow"
    >
    </app-ui-horizontal-flow>
  </ng-container>

  <app-ui-faq
    *ngIf="
      creditCampaignPage.templateData.faq &&
      creditCampaignPage.templateData.faq.faqItems &&
      creditCampaignPage.templateData.faq.faqItems.length > 0
    "
    [faqs]="creditCampaignPage.templateData.faq.faqItems"
    [subtitle]="creditCampaignPage.templateData.faq.subtitle"
    [title]="creditCampaignPage.templateData.faq.title"
  ></app-ui-faq>
</app-base-layout>
