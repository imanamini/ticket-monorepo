<div class="driving-fine-payment-methods">
  <div class="container">
    <div class="accordion">
      <div
        class="accordion-item"
        [ngClass]="{ active: isExpanded }"
      >
        <div
          class="accordion-header"
          (click)="toggleAccordion()"
        >
          <div class="title">{{ paymentMethods.title }}</div>
          <div class="accordion-indicator"></div>
        </div>
        <div
          class="accordion-content"
          [ngClass]="{ expanded: isExpanded }"
        >
          <div class="methods">
            <ng-container *ngFor="let method of paymentMethods.items">
              <div class="method">
                <div class="top">
                  <div class="icon">
                    <img
                      *ngIf="method.icon && method.icon.url"
                      [ngSrc]="method.icon.url"
                      height="24"
                      width="24"
                    />
                  </div>
                  <div>
                    <div class="item-title">{{ method.title }}</div>
                    <div class="item-description">{{ method.description }}</div>
                  </div>
                </div>
                <div class="bottom">
                  <div class="cost-title">{{ method.costTitle }}</div>
                  <div class="cost-amount">{{ method.costAmount }}</div>
                </div>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
