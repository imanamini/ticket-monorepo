<div class="benefits surface-brand">
  <div class="container d-flex flex-column align-items-center justify-content-center">
    <div class="title text-oninvert-high mb-large">{{ benefit()?.title }}</div>
    <div class="subtitle text-oninvert-high b-1 mb-mega">
      {{ benefit()?.description }}
    </div>
    <div
      class="gallery d-flex flex-wrap"
      [ngClass]="'items-' + benefit()?.values.length"
    >
      @for (item of benefit()?.values; track $index) {
        <div class="gallery-item d-flex flex-column justify-content-center align-items-center">
          <div class="gallery__image mb-large">
            <img src="{{item?.icon?.url}}" alt=""/>
          </div>
          <div class="gallery__title mb-small st-4 text-oninvert-high">{{ item?.title }}</div>
        </div>
      }
    </div>
  </div>
</div>
