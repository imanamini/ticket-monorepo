<div class="bnpl-steps py-hulk" [ngClass]="{'black-friday': blackFridayMode()}">
  <div class="text-align-center title mb-medium" [ngClass]="{'text-oninvert-high': blackFridayMode()}">
    {{ purchaseStep()?.title }}
  </div>
  <div class="text-align-center subtitle" [ngClass]="{'text-oninvert-high': blackFridayMode() , 'bnpl-subtitle' : bnplMode() , 'b-2' : !bnplMode()}">
    {{ purchaseStep()?.subtitle }}
  </div>
  <div class="d-flex justify-content-center align-items-start gap-massive bnpl-step-list">

    @for (step of purchaseStep()?.steps; track $index) {
      <div class="bnpl-step-item">
        <div class="image-wrapper mb-medium surface-elevated">
          <img [src]="step?.image?.url" alt=""/>
        </div>
        <div class="content">
          <div class="title st-5 mb-tiny text-align-center" [ngClass]="{'text-oninvert-high': blackFridayMode()}">
            {{ step?.title }}
          </div>
          <div class="description b-3" [innerHTML]="sanitize(step?.description)">
          </div>
        </div>
      </div>
    }
  </div>
</div>
