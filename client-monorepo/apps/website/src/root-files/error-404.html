<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>دیجی پی</title>
    <style>
      .errors-main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 5% 2rem 5%;
        direction: rtl;
      }

      .errors-text {
        font-size: 24px;
        color: #061962;
        font-weight: 800;
        margin: 2rem auto;
        text-align: center;
      }

      .errors-text-number {
        font-size: 24px;
        color: #0040ff;
        font-weight: 800;
      }

      .errors-subtitle {
        margin-top: 4px;
        font-weight: 600;
        font-size: 16px;
        color: #6e798d;
        line-height: 2;
        margin-bottom: 24px;
      }

      .errors-btn-wrapper {
        margin-bottom: 24px;
        display: flex;
      }

      .errors-image {
        max-width: 680px;
        max-height: 50vh;
      }

      .suggested-services {
        border-radius: 24px;
        border: 1px solid #dee3e7;
        max-width: 461px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 38px;
        padding-bottom: 50px;
      }

      .suggested-services-title {
        margin-bottom: 29px;
      }

      .suggested-services-title span {
        text-align: right;
        font-size: 14px;
        color: #2c3544;
      }

      .suggested-services-items {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 38px;
        row-gap: 18px;
      }

      .suggested-services-items .suggested-services-item {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
      }

      .suggested-services-item .item-icon {
        margin-left: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background-color: #fff5ee;
      }

      .suggested-services-item .item-icon.blue-background {
        background-color: #f0f5ff;
      }

      .suggested-services-item .item-icon img {
        width: 36px;
        height: 36px;
      }

      .suggested-services-item .item-content .content-title span {
        font-size: 14px;
        font-weight: 500;
        color: #061962;
      }

      .suggested-services-item .item-content .content-subtitle span {
        font-size: 12px;
        font-weight: 500;
        color: #8d99a8;
      }

      @media (max-width: 992px) {
        .errors-main {
          padding: 0 5% 2rem 5%;
        }
      }

      @media (max-width: 768px) {
        .errors-image {
          max-width: 500px;
        }

        .errors-text,
        .errors-text-number {
          font-size: 20px;
        }

        .errors-subtitle {
          font-size: 18px;
        }
      }

      @media (max-width: 577px) {
        .errors-main {
          padding: 0 5% 2rem 5%;
        }

        .errors-image {
          max-width: 400px;
        }

        .errors-text,
        .errors-text-number {
          font-size: 16px;
        }

        .errors-subtitle {
          font-size: 14px;
        }

        .suggested-services-items {
          display: flex;
          flex-direction: column;
        }
      }

      @media (max-width: 400px) {
        .errors-image {
          max-width: 320px;
        }

        .errors-text,
        .errors-text-number {
          font-size: 12px;
        }

        .errors-subtitle {
          font-size: 10px;
        }
      }

      a.button {
        text-align: center;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        font-size: 14px;
        padding: 12px 24px;
        min-width: 100px;
        font-weight: 700;
        border: 1px solid #0040ff;
        background: #0040ff;
        color: #fff;
        border-radius: 12px;
        box-shadow: none;
        cursor: pointer;
      }

      .texts {
        text-align: center;
      }

      @media (max-width: 1280px) {
        .button {
          min-width: 100px;
        }
      }

      @media (max-width: 744px) {
        .button {
          font-size: 12px;
        }
      }
    </style>
  </head>
