      .splash-slogan {
        width: 110px;
        height: 28px;
        transition: transform 3s ease;
        background-image: linear-gradient(-70deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
        background-repeat: no-repeat;
        animation: slogan-blink 2.5s forwards linear 0s;
        position: absolute;
        display: flex;
        left: 0;
        opacity: 1;
      }
      .splash-slogan-wrapper::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background-image: linear-gradient(-70deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 1) 100%);
        animation: slogan-show 1.5s forwards linear 2s;
        opacity: 0;
      }
      .glow1 {
        background-color: rgba(0, 195, 255, 0.3);
        height: 548px;
        width: 548px;
        border-radius: 50%;
        position: fixed;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
        mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 70%);
        box-shadow: rgba(0, 195, 255) 0px 0px 20px 20px;
        animation: moveGlow1 14s infinite linear;
      }
      .glow2 {
        background-color: rgba(124, 38, 233, 0.7);
        height: 548px;
        width: 548px;
        border-radius: 50%;
        position: fixed;
        left: 100%;
        top: 100%;
        transform: translate(-50%, -50%);
        mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 70%);
        box-shadow: rgba(124, 38, 233) 0px 0px 20px 20px;
        animation: moveGlow2 14s infinite linear;
      }
      .hider {
        opacity: 1;
        animation: getHide 0s 0.5s forwards;
      }
      .shower {
        opacity: 0;
        animation: getShow 0s 0.5s forwards;
      }
      @media (min-aspect-ratio: 1/1) {
        /* This runs when width >= height */
        .glow1 {
          animation: moveGlow1-width 14s infinite linear;
        }
        .glow2 {
          animation: moveGlow2-width 14s infinite linear;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        /* This runs when width <= height */
        .glow1 {
          animation: moveGlow1 14s infinite linear;
        }
        .glow2 {
          animation: moveGlow2 14s infinite linear;
        }
      }
      body {
        position: relative;
        height: 100dvh;
        width: 100svw;
        margin: 0;
      }
      @keyframes logo-blink {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
        75% {
          opacity: 0.4;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes growUp {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes moveGlow1 {
        0% {
          left: 0;
          top: 0;
        }
        20% {
          left: 100%;
          top: 0;
        }
        50% {
          left: 100%;
          top: 100%;
        }
        70% {
          left: 0;
          top: 100%;
        }
        100% {
          left: 0;
          top: 0;
        }
      }
      @keyframes moveGlow1-width {
        0% {
          left: 0;
          top: 0;
        }
        30% {
          left: 100%;
          top: 0;
        }
        50% {
          left: 100%;
          top: 100%;
        }
        80% {
          left: 0;
          top: 100%;
        }
        100% {
          left: 0;
          top: 0;
        }
      }
      @keyframes moveGlow2 {
        0% {
          left: 100%;
          top: 100%;
        }
        20% {
          left: 0;
          top: 100%;
        }
        50% {
          left: 0;

      @keyframes moveGlow2-width {
        0% {
          left: 100%;
          top: 100%;
        }
        30% {
          left: 0;
          top: 100%;
        }
        50% {
          left: 0;
          top: 0;
        }
        80% {
          left: 100%;
          top: 0;
        }
        100% {
          left: 100%;
          top: 100%;
        }

      @keyframes getHide {
        from {
          opacity: 1;
          z-index: 999;
        }
        to {
          opacity: 0;
          z-index: -999;
        }
      }
      @keyframes getShow {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(66px);
        }
        to {
          transform: translateY(calc(-100% - 16px));
        }
      }
      @keyframes l3 {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes slogan-blink {
        0% {
          left: -100%;
          background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
        }
        33% {
          left: 100%;
          background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
        }
        66% {
          left: -100%;
          background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
        }
        99% {
          left: 0;
          background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
        }
        100% {
          left: 0;
          background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0) 100%);
          opacity: 0;

    <script>
      var now = Date.now();

      // Function to safely check if localStorage is available
      function isLocalStorageAvailable() {
        try {
          const test = '__localStorage_test__';
          localStorage.setItem(test, test);
          localStorage.removeItem(test);
          return true;
        } catch (e) {
          return false;
        }
      }

      // Function to safely get from localStorage
      function safeGetLocalStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          console.warn('localStorage access denied:', e);
          return null;
        }
      }

      // Function to safely set to localStorage
      function safeSetLocalStorage(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          console.warn('localStorage write denied:', e);
          return false;
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        if (isLocalStorageAvailable()) {
          const splashTime = safeGetLocalStorage('splashTime');
          if (!splashTime) {
            showSplash();
          } else {
            if (now - parseInt(splashTime) > 60 * 60 * 1000) {
              showSplash();
            }
          }
        } else {
          showSplash();
        }
      });

      const showSplash = function () {
        try {
          if (document.getElementById('nativeSplash')) {
            window.showSplash = true;
            document.getElementById('nativeSplash').style.display = 'flex';
          }
          if (document.getElementById('angularSplash')) {
            window.showSplash = true;
            document.getElementById('angularSplash').style.display = 'flex';
          }
        } catch (e) {
          console.warn(e);
        }

        // Safely store the splash time
        if (isLocalStorageAvailable()) {
          safeSetLocalStorage('splashTime', now.toString());
        }
      };
    </script>
