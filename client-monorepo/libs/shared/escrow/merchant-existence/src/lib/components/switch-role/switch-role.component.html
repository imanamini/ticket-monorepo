<div class="w-100 d-flex justify-content-center p-medium surface-high-contrast">

    [mode]="'section'"
    [size]="'small'"
    [style]="'tinted-on-elevated'"
    [leftIcon]="{ name: 'change', type: 'linear' }"

  </ngx-button>
</div>
