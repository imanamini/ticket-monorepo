<div class="payment-method-container flex-column align-items-center h-100 pt-big">
  <div class="features-title d-flex justify-content-space-between align-items-center">
    <div class="d-flex align-items-center gap-small c-1 text-onback-medium">
      روش پرداخت
      <span class="stroke d-flex border-b-100 border-color-tint"></span>
    </div>
    <div class="d-flex align-items-center c-3 gap-small text-onback-high">
      <span>زمان باقیمانده:</span>
      <ngx-count-down
        (finished)="expiredTtl.emit()"
        [timeInSeconds]="time()"
        [type]="'mm:ss'"
        class="count-down d-flex justify-content-end"
      >
      </ngx-count-down>
    </div>
  </div>
  <div class="features pt-small">
    <div
      class="payment-method d-flex align-items-center justify-content-space-between"
      #PaymentMethod
      *ngFor="let item of ticketInfoService.state?.features"
      (click)="onSelectFeature(PaymentMethod, item)"
      [ngClass]="{
        'item-selected': item.method.toString() === paymentMethodService?.selectedFeature()?.method?.toString(),
        hide: !item.visible && hasExistHiddenFeatures(),
        'item-disable': TicketInfoStatusEnum[item.status] === 'INACTIVE',
      }"
    >
      <div class="icon d-flex justify-content-center align-items-center surface-back ml-minus">
        @if (item.method === paymentMethodService?.selectedFeature()?.method) {
          <ui-api-image
            [imageId]="item.selectedIcon"
            [height]="'24px'"
            class="business-logo"
          ></ui-api-image>
        } @else {
          <ui-api-image
            [imageId]="item.icon"
            [height]="'24px'"
            class="business-logo"
          ></ui-api-image>
        }
      </div>

      <div class="details d-flex align-items-center justify-content-space-between flex-grow py-medium pl-small">
        <div class="title bt-3 text-onback-medium">
          {{ item.title }}
          <div class="description d-flex align-items-center justify-content-start mt-low c-2 text-onback-low">
            <span>{{ item.description }}</span>
          </div>
        </div>

        <div
          class="selection"
          *ngIf="!item.badge && !item.ActionButton"
        >
          <ngx-radio-button
            [checked]="item.method === paymentMethodService?.selectedFeature()?.method"
            [size]="20"
            [disabled]="TicketInfoStatusEnum[item.status] === 'INACTIVE'"
          >
          </ngx-radio-button>
        </div>

        <div
          class="badge d-flex align-items-center justify-content-center l-2"
          *ngIf="item.badge"
        >
          <div
            class="badge-item d-flex justify-content-center align-items-center px-small"
            [ngxTooltip]="item.badge.message"
            [ngStyle]="{
              color: item.badge.textColor,
              'background-color': item.badge.backgroundColor,
              'border-color': item.badge.borderColor,
            }"
          >
            {{ item.badge.value || 'نامشخص' }}
          </div>
        </div>

        <div
          class="action-button"
          *ngIf="item.ActionButton"
          (click)="creditFeatureService.openModal(item.ActionButton.actionUrl)"
        >
          <div
            class="action-button-item"
            [ngxTooltip]="item.ActionButton.message"
            [ngStyle]="{
              color: item.ActionButton.textColor,
              'background-color': item.ActionButton.backgroundColor,
              'border-color': item.ActionButton.borderColor,
            }"
          >
            {{ item.ActionButton.value || 'نامشخص' }}
          </div>
        </div>
      </div>
    </div>
    @if (hasExistHiddenFeatures()) {
      <ngx-button
        class="d-flex flex-row-reverse"
        [style]="'link'"
        [leftIcon]="{ name: 'arrow-2-down', type: 'linear' }"
        (clickHandler)="hasExistHiddenFeatures.set(false)"
        [size]="'medium'"
      >
        مشاهده سایر روش‌ها
      </ngx-button>
    }
  </div>

  <div class="hidden-lg"></div>
</div>
