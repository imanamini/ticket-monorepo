<section
  class="w-100 d-flex flex-column justify-content-center align-items-center text-oninvert-high"
  (click)="openDetail(asset())"
>
  @if (asset().isLoaded) {
    <p class="amount d-flex align-items-center gap-tiny">
      @if (assetIsHidden()) {
        <span class="t-4">*****</span>
      } @else {
        <span class="t-4">{{ asset()?.totalBalance | thousands }}</span>
      }
      <span class="t-6 is-currency">ریال</span>
    </p>
  } @else {
    <common-ui-loading-dots
      [size]="8"
      class="amount d-flex align-items-center"
    ></common-ui-loading-dots>
  }

  <div class="d-flex justify-content-center align-items-center gap-low">
    <p class="l-2 text-oninvert-medium">{{ asset()?.subtitle }}</p>
    @if (showInfoIcon()) {
      <ngx-icon
        (click)="openDetail(asset())"
        class="cursor-pointer"
        [name]="'info-circle'"
        [iconSize]="'16px'"
      ></ngx-icon>
    }
  </div>
</section>
