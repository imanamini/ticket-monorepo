<div class="d-flex flex-column">
  @for (asset of assetsDetail(); track asset.id) {
    <div
      class="d-flex align-items-flex-start gap-small"
      [ngClass]="!$last ? 'pb-minus' : ''"
      (click)="handleCta(asset)"
    >
      <div class="surface-back radius-rounded p-small">
        <common-icon-dp-icon
          [iconSize]="'24'"
          [icon]="asset.icon"
          [iconType]="'due'"
          [classes]="asset.isDisabled ? 'text-onback-disabled' : ''"
          [style.color]="asset.primaryColor"
        ></common-icon-dp-icon>
      </div>
      <div
        class="d-flex align-items-center flex-grow pb-tiny"
        [ngClass]="!$last ? 'border-b-100 border-color-air' : ''"
      >
        <div class="d-flex flex-column flex-grow">
          <p
            class="bt-3"
            [ngClass]="asset.isDisabled ? 'text-onback-disabled' : 'text-onback-medium'"
          >
            {{ asset.title }}
          </p>
          @if (asset.isDisabled) {
            <p
              class="subtitle l-3 d-flex align-items-center text-onback-disabled"
              [style.color]="asset.subtitleColor"
            >
              غیر قابل استفاده!
            </p>
          } @else {
            @switch (asset.subtitleType) {
              @case ('text') {
                <p
                  class="subtitle l-3 d-flex align-items-center"
                  [style.color]="asset.subtitleColor"
                >
                  {{ asset.subtitle }}
                </p>
              }
              @case ('price') {
                <p class="subtitle amount d-flex align-items-center gap-micro">
                  <span class="st-5 text-onback-high">{{ asset.subtitle | thousands }}</span>
                  <span class="l-3 text-onback-medium is-currency">ریال</span>
                </p>
              }
            }
          }
        </div>
        <div class="cta-asset-detail">
          <ngx-button
            [size]="'tiny'"
            [style]="'link'"
            [mode]="'form'"
            [leftIcon]="{ name: 'arrow-2-left', type: 'linear' }"
            [classNames]="[asset.isDisabled ? 'text-onback-low' : 'text-onback-medium']"
          >
            {{ asset?.actionText }}
          </ngx-button>
        </div>
      </div>
    </div>
  }
</div>
