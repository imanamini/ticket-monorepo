<div class="discount-container px-medium radius-minus c-2 w-100 d-flex">
  <div class="title d-flex py-medium mw-50 text-align-right justify-content-center align-items-center">
    {{ title() }}
  </div>
  <div class="d-flex flex-column justify-content-space-between">
    <div class="circle"></div>
    <div class="divider"></div>
    <div class="circle"></div>
  </div>
  <div
    [ngxTooltip]="'کپی شد'"
    [tooltipPosition]="'top'"
    [tooltipType]="'click'"
    [closeTimeout]="3000"
    class="voucher-container d-flex justify-content-center align-items-center flex-grow"
    (click)="copyToClipboard()"
  >
    <div class="voucher-code radius-giant gap-micro d-flex align-items-center surface-glass-invert p-low cursor-pointer">
      <common-icon-dp-icon
        [icon]="'document-copy'"
        [iconSize]="'16'"
      ></common-icon-dp-icon>
      <div class="voucher-text">{{ code() }}</div>
    </div>
  </div>
</div>
