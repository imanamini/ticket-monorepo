<div class="w-100 d-flex flex-column surface-elevated h-100svh">
  <ngx-app-bar
    class="w-100"
    [title]="'جزییات وثیقه'"
    [rightButton]="{
      icon: 'arrow-right',
      style: 'neutral-link',
      mode: 'icon-only',
      size: 'medium',
    }"
    (onRightButtonClick)="onBackHandler()"
  />

  <div class="flex-1 surface-elevated w-100 mt-big d-flex flex-column px-plus pb-plus">
    @if (state().bnplAmount > 0) {
      <div class="w-100 border-100 border-color-light radius-medium p-medium">
        <wealth-applet-received-credit [creditAmount]="state().bnplAmount" />
      </div>
    }

    <div class="w-100 d-flex mt-minus">
      <p class="c-2 text-onback-high">با توجه به اعتبار دریافت شده شما، با این تبدیل تغییرات زیر در داراییتان ایجاد می‌شود:</p>
    </div>

    <div class="w-100 mt-huge d-flex flex-column gap-medium position-relative justify-content-center align-items-center">
      <div class="w-100 d-flex flex-column radius-medium px-plus py-minus surface-glass-onelevated position-relative">
        <div class="d-flex align-items-center gap-small">
          <div class="surface-elevated radius-rounded icon-container d-flex align-items-center justify-content-center">
            <img
              src="./wealth-assets/svg/swap-from.svg"
              alt="swap from"
            />
          </div>

          <p class="st-6 text-onback-high">قبل از تبدیل (وضعیت فعلی)</p>
        </div>

        <div class="w-100 mt-minus d-flex flex-column">
          <div class="w-100 d-flex flex-column aling-items-center">
            <wealth-applet-swap-confirmation-detail [detail]="currentDetail()" />
          </div>
        </div>

        <div class="surface-elevated swap-icon-container radius-rounded d-flex align-items-center justify-content-center">
          <div class="swap-icon radius-rounded surface-glass-onelevated d-flex align-items-center justify-content-center">
            <ngx-icon
              [name]="'arrow-down'"
              [iconSize]="'20px'"
            />
          </div>
        </div>
      </div>

      <div class="w-100 d-flex flex-column radius-medium px-plus py-minus surface-glass-onelevated">
        <div class="d-flex align-items-center gap-small">
          <div class="surface-elevated radius-rounded icon-container d-flex align-items-center justify-content-center">
            <img
              src="./wealth-assets/svg/swap-from.svg"
              alt="swap from"
            />
          </div>

          <p class="st-6 text-onback-high">بعد از تبدیل</p>
        </div>

        <div class="w-100 mt-minus d-flex flex-column">
          <div class="w-100 d-flex flex-column aling-items-center">
            <wealth-applet-swap-confirmation-detail [detail]="subsequentDetail()" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="w-100 px-plus d-flex flex-column gap-small surface-elevated py-medium sticky-action-group">
    <ngx-button
      class="mt-medium"
      [style]="'fill'"
      [fullWidth]="true"
      [mode]="'form'"
      size="medium"
      [isLoading]="btnLoading()"
      [disabled]="btnLoading()"
      (clickHandler)="continueBottomsheet()"
    >
      ثبت تبدیل
    </ngx-button>
  </div>
</div>
