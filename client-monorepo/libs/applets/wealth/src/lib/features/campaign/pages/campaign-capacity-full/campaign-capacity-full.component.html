<div class="w-100 d-flex flex-column surface-elevated h-100dvh">
  <ngx-app-bar
    class="w-100"
    [title]="'دریافت جایزه گنج'"
    [rightButton]="{
      icon: 'arrow-right',
      style: 'neutral-link',
      mode: 'icon-only',
      size: 'medium',
    }"
    (onRightButtonClick)="onBackHandler()"
  />

  <div class="d-flex flex-column flex-1 align-items-center justify-content-start w-100">
    <img
      src="wealth-assets/images/treasure-hunt-2.svg"
      class="w-100"
    />
    <p class="st-7 text-onback-high">ظرفیت دریافت جایزه تکمیل شده!</p>
    <p class="bt-2 text-onback-low mt-small">برای جایزه‌های بعدی گوش به زنگ باشید.</p>
  </div>

  <div class="w-100 surface-elevated px-plus py-medium sticky-action-group">
    <ngx-button
      [buttonId]="'CAMPAIGN_CAPACITY_FULL'"
      [style]="'fill'"
      size="medium"
      [fullWidth]="true"
      (clickHandler)="onBackHandler()"
    >
      متوجه شدم
    </ngx-button>
  </div>
</div>
