<div class="w-100 d-flex flex-wrap align-content-start surface-elevated">
  <wealth-applet-app-bar-wrapper
    class="w-100"
    [title]="'بررسی اطلاعات'"
    (onBack)="onBackHandler()"
  />

  <div class="w-100 d-flex flex-column justify-content-space-between align-items-center pt-massive px-plus content">
    <div class="w-100 d-flex align-items-center flex-column">
      <div class="icon-container surface-back radius-rounded d-flex p-big align-items-center justify-content-center">
        <ngx-icon
          class="warning-icon"
          [name]="'error-circle'"
          [iconSize]="'48px'"
          [type]="'bold'"
        />
      </div>

      <p class="st-3 text-onback-high text-align-center mt-huge">کد پستی وارد شده در سامانه املاک و اسکان ثبت نشده است</p>
      <p class="b-2 text-onback-medium text-align-center mt-tiny">
        {{ description() }}
      </p>
    </div>

    <div class="footer pb-plus">
      <ngx-alert
        class="w-100"
        color="blue"
        size="md"
        [text]="alertText()"
        [hasCloseIcon]="false"
      ></ngx-alert>

      <div class="w-100 mt-medium d-flex flex-wrap gap-minus">
        <ngx-button
          [fullWidth]="true"
          [style]="'tinted-on-elevated'"
          (clickHandler)="onContinue()"
        >
          {{ continueButtonText() }}
        </ngx-button>
        <ngx-button
          [fullWidth]="true"
          (clickHandler)="registerPostalCode()"
          >ورود به سامانه املاک و اسکان</ngx-button
        >
      </div>
    </div>
  </div>
</div>
