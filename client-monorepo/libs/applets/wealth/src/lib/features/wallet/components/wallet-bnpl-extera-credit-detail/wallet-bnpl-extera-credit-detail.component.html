<div class="w-100 d-flex flex-column align-items-center">
  <img
    width="80px"
    height="80px"
    src="./wealth-assets/svg/bnpl-add.svg"
    alt="request"
  />

  <p class="text-align-center text-onback-high st-7 mt-big">افزایش اعتبار خوش‌حسابی</p>

    اگر اقساط خود را به موقع پرداخت کنید، اعتبار خوش‌حسابی شما در درخواست‌های بعدیتان افزایش می‌یابد.

  <ngx-button
