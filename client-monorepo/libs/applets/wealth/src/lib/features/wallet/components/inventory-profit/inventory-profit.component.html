<div class="w-100 d-flex flex-wrap">
  <div class="w-100 d-flex align-items-center gap-small">
    <img
      width="28"
      height="28"
      src="./wealth-assets/svg/profit-icon.svg"
      alt="profit"
    />

    <p class="c-2 text-onback-medium">سود سالانه {{ wallet()?.profit.dailyPercentage }} به صورت روز شمار</p>
  </div>

  @if (wallet().hasPendingTrade) {
    <ngx-alert
      [size]="'sm'"
      class="w-100 mt-minus"
      [color]="'yellow'"
      [hasCloseIcon]="false"
      [title]="alertTitle()"
      [text]="alertText()"
    />
  }
