@for (info of walletInfo(); track info.id) {
  <div class="d-flex justify-content-space-between pb-medium align-items-center">
    <div
      class="d-flex justify-content-center gap-small"
      (click)="handleShowInfo(info.id)"
    >
      <p class="b-2 text-onback-medium">
        {{ info.title }}
      </p>
      <img
        [className]="'cursor-pointer'"
        src="wealth-assets/icons/question.svg"
        [alt]="info.title"
      />
    </div>

    <div class="d-flex gap-tiny align-items-center">
      <span class="st-8 text-onback-high">{{ info.value | number }}</span>
      <span class="is-currency">ریال</span>
    </div>
  </div>
}

@if (hasInfo()) {
  <div class="d-flex gap-tiny pt-medium border-t-100 border-color-tint">
    <img
      src="wealth-assets/icons/information.svg"
      alt="information"
    />
    <span class="c-1 text-onback-low text-align-justify">{{ description() }}</span>
  </div>
}
