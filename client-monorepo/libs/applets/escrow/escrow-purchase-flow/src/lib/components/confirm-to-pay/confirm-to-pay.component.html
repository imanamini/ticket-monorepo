<div class="mt-minus">
  <escrow-purchase-flow-applet-order-overview
    [order]="order"
    [showDetailButton]="false"
    [showPrice]="false"
  ></escrow-purchase-flow-applet-order-overview>
  <div class="d-flex justify-content-space-evenly align-items-center surface-back radius-medium py-minus px-small my-medium">
    <div class="text-align-center">
      <p class="b-3 text-onback-low">مبلغ آگهی</p>
      <p class="b-1 text-onback-high">{{ orderPrice }}</p>
    </div>
    <ngx-button
      [mode]="'icon-only'"
      [size]="'tiny'"
      [style]="'neutral-link'"
      [leftIcon]="{ name: 'arrow-left', type: 'linear' }"
    >
    </ngx-button>
    <div class="text-align-center">
      <p class="b-3 text-onback-low">مبلغ توافق شده</p>
      <p class="b-1 text-onback-success">{{ agreedAmount }}</p>
    </div>
  </div>

  <div class="mb-big">
    @for (pi of paymentInfo; track $index) {
      <div
        class="d-flex justify-content-space-between py-pony"
        [ngClass]="{ 'border-t-100 border-b-100 border-color-light': $index === 1 }"
      >
        <p class="text-onback-low b-3">{{ pi.name }}</p>
        <p
          class="text-onback-low b-3"
          [ngClass]="{ 'text-onback-success': $index === 0 }"
        >
          {{ pi.value }}
        </p>
      </div>
    }
  </div>
  <div class="d-flex justify-content-space-between gap-big">
    <div>
      <p class="b-3 text-onback-high">مبلغ پرداختی</p>
      <p class="st-8 text-onback-high">{{ agreedAmount }}</p>
    </div>
    <ngx-button
      [mode]="'section'"
      [size]="'large'"
      [style]="'fill'"
      (clickHandler)="confirmAndPay()"
    >
      تایید و پرداخت
    </ngx-button>
  </div>
</div>
