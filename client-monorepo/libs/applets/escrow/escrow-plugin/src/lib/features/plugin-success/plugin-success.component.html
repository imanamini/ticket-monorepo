<common-ui-components-page-layout>
  <div class="d-flex flex-column justify-content-center align-items-center text-align-center p-medium h-100vh">
    <img
      src="assets/images/success-result.png"
      alt="success"
    />
    <p class="st-6 mt-huge mb-small">درخواست فعال سازی شما ثبت شد</p>
    <p class="b-2 text-onback-low mb-big">
      قابلیت خرید و فروش اعتباری امن دیجی‌پی با موفقیت ثبت شد و کارشناسان ما پس از بررسی به آگهی شما اضافه خواهند کرد.
    </p>
    <ngx-button
      [mode]="'section'"
      [size]="'large'"
      [style]="'tinted-on-elevated'"
    >
      متوجه شدم
    </ngx-button>
  </div>
</common-ui-components-page-layout>
