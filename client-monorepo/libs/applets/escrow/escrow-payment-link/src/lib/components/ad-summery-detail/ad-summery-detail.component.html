<a [routerLink]="['/payment-link/advertise']" [queryParams]="{ linkId: linkId() }" class="d-flex radius-minus border-100 border-color-light p-minus gap-small align-items-center">
  @if (data().images.length > 0) {
    <img
      class="ad-img radius-small"
      [src]="data().images[0]"
    />
  } @else {
    <div class="ad-img surface-glass-invert radius-small"></div>
  }
  <div class="d-flex flex-column gap-small">
    <span class="text-onback-medium b-2">{{ data().title }}</span>
    <span class="c-1 fw-bold"> {{ data().price | number }}ريال </span>
  </div>
  @if (zone() === 'app') {
    <div class="mr-auto">
      <ngx-button
        [mode]="'icon-only'"
        [size]="'tiny'"
        [style]="'tinted-on-elevated'"
        [leftIcon]="{ name: 'arrow-left' }"
        [routerLink]="'/payment-link/advertise'"
        [queryParams]="{ linkId: linkId() }"
      ></ngx-button>
    </div>
  }
</a>
