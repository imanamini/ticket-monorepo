<div
  class="d-flex align-items-center justify-content-space-between"
  [style.width]="size()"
  [style.height]="size()"
>
  <svg
    viewBox="0 0 100 100"
    class="circle-svg"
  >
    <!-- Background circle -->
    <circle
      cx="50"
      cy="50"
      r="50"
      [attr.fill]="secondaryColor()"
    />

    <!-- Filled segments -->
    @for (segment of segments(); track $index) {
      <path
        [attr.d]="getPath(segment.startAngle, segment.endAngle)"
        [attr.fill]="segment.filled ? primaryColor() : 'transparent'"
      ></path>
    }

    <!-- Dividing lines -->
    @for (line of dividingLines(); track $index) {
      <line
        x1="50"
        y1="50"
        [attr.x2]="line.x"
        [attr.y2]="line.y"
        stroke="white"
        stroke-width="4"
      />
    }
  </svg>
</div>
