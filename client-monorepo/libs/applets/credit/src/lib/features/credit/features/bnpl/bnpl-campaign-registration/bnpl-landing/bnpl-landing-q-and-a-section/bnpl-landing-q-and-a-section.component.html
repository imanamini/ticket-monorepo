<section class="faq section-with-padding">
  <div id="overlay"></div>
  <div class="container">
    @if (title) {
      <h2 class="text-align-center">{{ title }}</h2>
    }
    @if (subtitle) {
      <div class="subtitle text-align-center">{{ subtitle }}</div>
    }
    <ul class="faq_items d-flex flex-column">
      @for (item of visibleFaqs(); track item; let itemIndex = $index) {
        <li
          [id]="item.itemId || 'target' + (itemIndex + 1)"
          class="faq_item collapsible"
        >
          <div
            (click)="openItemFaq(itemIndex)"
            class="faq_question"
          >
            <span>{{ item.question }}</span>
            <div
              [class]="openItemIndex() === itemIndex ? 'open' : 'plus-close'"
              class="collapsible-sign collapsible-selector"
            ></div>
          </div>
          @if (openItemIndex() === itemIndex) {
            <div
              [innerHTML]="item.answer"
              class="faq_answer"
            >
              @if (item.link) {
                <a
                  [href]="item.link.url"
                  class="link"
                  >{{ item.link.title }}</a
                >
              }
            </div>
          }
        </li>
      }
    </ul>
    <div class="cta">
      <ngx-button
        (clickHandler)="toggleShowAll()"
        [style]="'link'"
      >
        {{ showAllButtonText() }}
        <ngx-icon
          [class]="showAll() ? 'rotate' : ''"
          [name]="'arrow-2-down'"
          [type]="'linear'"
          [iconSize]="'24px'"
        ></ngx-icon>
      </ngx-button>
    </div>
  </div>
</section>
