<div class="d-flex flex-column h-100">
  <div class="flex-grow overflow-auto">
    <app-debtor-info
      [fundProviderBusinessId]="userInfo().fundProviderDto.businessId"
      [title]="userInfo().fundProviderDto.title"
      [personInfo]="iplDetailService.personInfo()"
    />

    <div
      class="px-plus py-medium position-relative"
      dir="rtl"
    >
      <div class="select-all_wrapper pb-medium surface-back">
        <div class="d-flex align-items-center justify-content-space-between surface-elevated py-minus px-medium radius-plus select-all">
          <ngx-checkbox
            [(checked)]="checkAll"
            (checkedChange)="onCheckAllChange($event)"
            [size]="20"
          >
            <span class="bt-3 mr-small mt-micro d-block">انتخاب همه</span>
          </ngx-checkbox>
          <div class="text-onback-low b-3">{{ userInfo().unPaidInstallments.length + ' مورد' }}</div>
        </div>
      </div>

      @for (installment of serializedInstallments(); track installment.title) {
        <app-credit-installment-card
          class="mb-medium d-block"
          [(checked)]="installment.checked"
          (checkedChange)="onCheckChange($event, $index)"
          [title]="installment.title"
          [badge]="installment.badge"
          [subtitle]="installment.dateTitle"
          [amount]="installment.initialAmount"
          [penaltyAmount]="installment.penaltyAmount"
          [penaltyWaiverAmount]="installment.penaltyWaiverAmount"
        />
      }
    </div>
  </div>

  <app-credit-installment-payment-footer
    class="footer"
    [class.hide-footer]="hideFooter()"
    [finalAmount]="selectedAmounts().payable"
    [rows]="paymentFooterRows()"
    (cta)="onFooterPaymentClick()"
    [ctaLoading]="creditInstallmentPaymentService.gettingTicket()"
  />
</div>
