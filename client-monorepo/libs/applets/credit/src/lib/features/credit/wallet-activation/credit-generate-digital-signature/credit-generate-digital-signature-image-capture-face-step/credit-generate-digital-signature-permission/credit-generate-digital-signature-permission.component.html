<app-credit-app-bar
  (onBackButtonClick)="onBackClick()"
  [backButton]="true"
  title="امضای دیجیتال"
></app-credit-app-bar>
@if (!showLoading()) {
  <div class="flex-grow d-flex flex-column">
    <div class="flex-grow d-flex justify-content-center rtl pb-plus">
      <ngx-status-result
        [type]="'Status'"
        [iconState]="'info'"
        [description]="
          'ثبت ویدئو و تصویر برای ساخت امضای دیجیتال ضروری است. در ادامه، برای ثبت تصویر و ویدئو، دسترسی به دوربین و میکروفون از شما گرفته\n' +
          '          می‌شود.'
        "
        [title]="'دسترسی به میکروفون و دوربین'"
        [buttons]="buttons"
        (clicked)="onCtaClick()"
      >
      </ngx-status-result>
    </div>
  </div>
} @else {
  <credit-page-loading [active]="true"></credit-page-loading>
}
