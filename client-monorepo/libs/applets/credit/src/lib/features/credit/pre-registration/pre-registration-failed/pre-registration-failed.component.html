<app-credit-app-bar
  (onBackButtonClick)="close()"
  [backButton]="true"
  title="دریافت وام"
></app-credit-app-bar>
<div class="d-flex flex-column flex-grow">
  <div class="flex-grow justify-content-center pb-plus">
    @if (errorType()) {
      <ngx-status-result
        (clicked)="close()"
        [buttons]="buttons"
        [description]="data().description"
        [title]="data().title"
        [type]="'Status'"
        [iconState]="'error'"
      >
        <div
          html-content
          class="d-flex flex-column flex-grow justify-content-flex-end gap-medium"
        >
          @if (data().alert) {
            <ngx-alert
              [color]="'yellow'"
              [hasCloseIcon]="false"
              [text]="data().alert"
            />
          }
          <ngx-callout
            [mode]="'multiple'"
            [title]="'اقدامات لازم'"
            [showTitleBlink]="true"
            [messages]="data().calloutMessages"
          />
        </div>
      </ngx-status-result>
    }
  </div>
</div>
