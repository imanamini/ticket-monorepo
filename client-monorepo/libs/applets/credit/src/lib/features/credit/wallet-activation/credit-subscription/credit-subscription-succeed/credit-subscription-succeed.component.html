<app-credit-app-bar
  (onBackButtonClick)="prevStep.emit()"
  [backButton]="true"
  title="خرید اشتراک"
></app-credit-app-bar>
<div class="main-section d-flex flex-column flex-grow">
  <div class="d-flex flex-column flex-grow">
    <app-credit-scrollable-view [fullHeightContent]="true">
      <div class="d-flex flex-grow justify-content-center p-big rtl">
        <ngx-status-result
          [type]="'Status'"
          [iconState]="'done'"
          [description]="description()"
          [title]="title()"
          [buttons]="buttons"
          (clicked)="nextStep.emit()"
        >
          <div
            html-content
            class="d-flex flex-column flex-grow justify-content-flex-end"
          >
            <ngx-alert
              [color]="'yellow'"
              [hasCloseIcon]="false"
              [text]="alertMessage"
            />
          </div>
        </ngx-status-result>
      </div>
    </app-credit-scrollable-view>
  </div>
</div>
