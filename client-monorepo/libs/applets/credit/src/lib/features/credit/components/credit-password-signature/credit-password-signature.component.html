<div
  (click)="dynamicFocusInput(inputIndex())"
  class="d-flex flex-column flex-grow h-100 gap-big"
>
  <div class="top flex-grow"></div>
  <div class="d-flex flex-column flex-grow justify-content-center">
    <p class="st-8 text-onback-high text-align-center mb-medium rtl">{{ description() }}</p>
    <div
      #inputs
      [class.border-color-brand]="inputsBorderBrand()"
      [class.border-color-error]="errorText().length"
      [class.border-color-light]="inputsBorderLight()"
      class="inputs mx-auto ltr px-plus py-small radius-huge d-flex flex-row justify-content-space-between surface-elevated border-300"
    >
      @for (input of pinInputs(); track input; let i = $index) {
        <input
          (focusin)="inputFocusIn(i)"
          (keyup)="onInputKeyUp()"
          [readonly]="true"
          inputmode="numeric"
          maxlength="1"
          secretInput
          placeholder="-"
        />
      }
    </div>

    <div class="error-container d-flex flex-column align-items-center justify-content-flex-start gap-medium">
      <div class="l-3 text-onback-error rtl">{{ errorText() }}</div>
      @if (showForgetPassword() && !loading()) {
        <ngx-button
          ngxTrackableId
          trackerId="forgetPasswordButton"
          (clickHandler)="forgotPassword.emit()"
          [fullWidth]="true"
          [style]="'link'"
          [mode]="'form'"
        >
          رمز امضا را فراموش کردم
        </ngx-button>
      }
    </div>
  </div>
  <div class="flex-shrink">
    <div class="key-pad-container mb-hulk">
      @for (key of keyPadButtons(); track key) {
        <div>
          <div>
            @switch (key.type) {
              @case ('number') {
                <button
                  (click)="keyPadHit(key)"
                  class="key d-flex border-none align-items-center justify-content-center radius-rounded surface-back p-plus t-5 text-onback-high cursor-pointer"
                >
                  {{ key.value }}
                </button>
              }
              @case ('remove') {
                <button
                  (click)="keyPadHit(key)"
                  class="key remove-icon border-none d-flex align-items-center justify-content-center radius-rounded surface-back p-plus t-5 text-onback-high cursor-pointer"
                ></button>
              }
              @case ('submit') {
                <button
                  (click)="keyPadHit(key)"
                  [disabled]="loading()"
                  [class.submit]="!loading()"
                  class="key border-none d-flex align-items-center justify-content-center radius-rounded surface-brand p-plus t-5 text-onback-high cursor-pointer"
                >
                  @if (loading()) {
                    <ngx-spinner
                      size="lg"
                      color="white"
                    ></ngx-spinner>
                  } @else {
                    <ngx-icon
                      class="text-oninvert-high"
                      [name]="'check'"
                    ></ngx-icon>
                  }
                </button>
              }
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
