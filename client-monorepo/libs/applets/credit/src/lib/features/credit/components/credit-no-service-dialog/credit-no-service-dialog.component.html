<div
  [class]="{ 'not-blocker': notBlocker() }"
  class="credit-api-blocked-error d-flex my-0 mx-auto p-plus"
>
  <div class="d-flex flex-column">
    <div class="flex-grow d-flex flex-column align-items-center justify-content-center">
      <ngx-status-result
        (clicked)="checkWhatButtonClicked($event)"
        [buttons]="buttons()"
        [description]="message()!"
        [title]="title()!"
        [type]="'Status'"
        [iconState]="'error'"
      >
      </ngx-status-result>
    </div>
  </div>
</div>
