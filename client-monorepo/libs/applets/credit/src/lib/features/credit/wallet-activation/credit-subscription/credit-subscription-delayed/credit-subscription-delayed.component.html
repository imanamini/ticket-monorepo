<app-credit-app-bar
  (onBackButtonClick)="closeStep.emit()"
  [backButton]="true"
  title="بررسی اشتراک دیجی‌پی"
></app-credit-app-bar>
<div class="main-section rtl d-flex flex-column flex-grow">
  <div class="flex-grow d-flex flex-column">
    <app-credit-scrollable-view [fullHeightContent]="true">
      <div class="d-flex flex-grow rtl justify-content-center p-big">
        <ngx-status-result
          [description]="description()"
          [title]="title()"
          [type]="'Status'"
          [iconState]="'info'"
          [buttons]="buttons"
          (clicked)="submit()"
        >
          <div
            html-content
            class="d-flex flex-column flex-grow justify-content-flex-end"
          >
            <ngx-alert
              [color]="'yellow'"
              [hasCloseIcon]="false"
              [text]="'توجه کنید که در صورت داشتن چک برگشتی و اقساط معوق در این مدت درخواست شما از جانب بانک رد می‌شود'"
            />
          </div>
        </ngx-status-result>
      </div>
    </app-credit-scrollable-view>
  </div>
</div>
