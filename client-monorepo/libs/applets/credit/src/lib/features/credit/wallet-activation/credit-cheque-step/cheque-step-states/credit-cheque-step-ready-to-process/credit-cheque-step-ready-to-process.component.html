<app-credit-app-bar
  (onBackButtonClick)="close.emit()"
  [backButton]="true"
  title="ثبت چک ضمانت"
></app-credit-app-bar>
<div class="d-flex flex-column flex-grow">
  <div class="flex-grow justify-content-center pb-plus">
    <ngx-status-result
      (clicked)="close.emit()"
      [buttons]="buttons"
      [description]="'طی ۷۲ ساعت کاری آینده تصویر چک شما را بررسی می‌کنیم و با پیامک به شما اطلاع می‌دهیم'"
      [title]="'در انتظار بررسی تصویر چک'"
      [type]="'Waiting'"
      [iconState]="'waiting'"
    >
      <ng-container status-image>
        <div [class]="'status-image'"></div>
      </ng-container>
    </ngx-status-result>
  </div>
</div>
