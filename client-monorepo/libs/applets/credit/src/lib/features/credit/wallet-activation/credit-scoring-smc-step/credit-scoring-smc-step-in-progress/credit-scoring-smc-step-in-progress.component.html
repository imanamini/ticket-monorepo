<app-credit-app-bar
  (onBackButtonClick)="back.emit()"
  [backButton]="true"
  [title]="'امکان‌سنجی دریافت اعتبار'"
></app-credit-app-bar>
<div class="d-flex flex-column flex-grow w-100">
  <div class="flex-grow justify-content-center rtl w-100">
    <ngx-status-result
      [description]="data.message"
      [title]="data.title"
    >
      <ng-container status-image>
        <ngx-waiting-stepper
          [state]="WaitingStepperStateEnum.PROGRESS"
          [isSelfProgress]="true"
          [timerDeadline]="30"
        ></ngx-waiting-stepper>
      </ng-container>
    </ngx-status-result>
  </div>
</div>
