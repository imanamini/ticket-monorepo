<app-credit-app-bar
  (onCloseButtonClick)="closeButton()"
  [closeButton]="true"
  [title]="title()"
></app-credit-app-bar>
@if (!errorMessage()) {
  <div class="iframe-container">
    @if (htmlContent() && !gettingData()) {
      <iframe [srcdoc]="htmlContent()"></iframe>
    }
  </div>
}
@if (errorMessage()) {
  <div class="error-wrapper">
    <div class="title">خطا</div>
    <p>{{ errorMessage() }}</p>
  </div>
}
<credit-page-loading [active]="gettingData()!"></credit-page-loading>
