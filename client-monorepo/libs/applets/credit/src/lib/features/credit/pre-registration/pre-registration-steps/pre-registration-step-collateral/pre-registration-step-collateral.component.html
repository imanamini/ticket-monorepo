<app-credit-app-bar
  (onBackButtonClick)="back()"
  [backButton]="true"
  title="ضمانت"
></app-credit-app-bar>
<div class="top-section d-flex flex-column p-big flex-grow rtl">
  <app-credit-scrollable-view
    [fullHeightContent]="true"
    [hasFade]="true"
  >
    <div class="flex-grow d-flex flex-column">
      <div class="page-content-top flex-grow d-flex flex-column gap-minus">
        @if (collateralOptions().length === 1) {
          <div
            class="pt-medium pb-small px-small radius-big border-100 border-color-light d-flex flex-column justify-content-center align-items-center"
          >
            <h1 class="st-5 px-big text-onback-medium w-100 text-align-right">
              {{ collateralOptions()[0].title }}
            </h1>
            <app-pre-registration-step-collateral-info
              (previewStepClicked)="previewSteps($event)"
              [collateralOption]="collateralOptions()[0]"
              [infoMapperItem]="infoMapper()[selectedCollateralType()!]"
              [showHintMessage]="!!(selectedCollateralType() && selectedCollateralTypeRadio() === collateralOptions()[0].value)"
            >
            </app-pre-registration-step-collateral-info>
          </div>
        }

        @if (collateralOptions().length > 1) {
          @for (collateralOption of collateralOptions(); track collateralOption) {
            <common-ui-components-selection-box
              (selectedOption)="onChangeCollateral(collateralOption.value)"
              [config]="collateralOption.listOption"
              [checkboxType]="true"
            >
              <app-pre-registration-step-collateral-info
                (previewStepClicked)="previewSteps($event)"
                [collateralOption]="collateralOption"
                [infoMapperItem]="infoMapper()[selectedCollateralType()!]"
                [showHintMessage]="!!(selectedCollateralType() && selectedCollateralTypeRadio() === collateralOption.value)"
              >
              </app-pre-registration-step-collateral-info>
            </common-ui-components-selection-box>
          }
        }
      </div>
    </div>
  </app-credit-scrollable-view>
</div>

<div class="call-to-action-section p-plus">
  <ngx-button
    (clickHandler)="onSubmit()"
    [disabled]="!selectedCollateralTypeRadio() || loading()"
    [isLoading]="loading()"
    [fullWidth]="true"
    ngxTrackableId
    trackerId="collateralInfoConfirmButtonClick"
    >تایید و ادامه
  </ngx-button>
</div>
