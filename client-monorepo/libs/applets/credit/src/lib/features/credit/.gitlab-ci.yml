---
stages:
  - trigger

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
    - when: never

Build Express:
  stage: trigger
  trigger:
    project: "frontend/express"
    branch: "$CI_COMMIT_BRANCH"
    forward:
      yaml_variables: false

Build Client MonoRepo:
  stage: trigger
  trigger:
    project: "frontend/monorepo/client-monorepo"
    branch: "$CI_COMMIT_BRANCH"
    forward:
      yaml_variables: false
