@if (!reportUnreadyType() && !showReportPage()) {
  <app-credit-scoring-result-page
    (report)="showReport()"
    [creditId]="creditId()!"
    [fundProviderCode]="fundProviderCode()!"
    [gettingData]="gettingData()!"
    [status]="status()!"
    [trackingCode]="trackingCode()!"
    [suggestedPlans]="suggestedPlans()"
    class="d-flex flex-column flex-grow"
  ></app-credit-scoring-result-page>
}

@if (reportUnreadyType() && !showReportPage()) {
  <div class="d-flex flex-column flex-grow">
    @if (reportUnreadyType() === 'EXIT' || reportUnreadyType() === 'COUNTDOWN') {
      <app-credit-app-bar
        (onBackButtonClick)="exit()"
        [backButton]="true"
        [title]="title()"
      ></app-credit-app-bar>
    }
    <div class="d-flex flex-column flex-grow">
      <app-credit-scrollable-view [fullHeightContent]="true">
        <div class="d-flex flex-column flex-grow justify-content-center align-items-center rtl">
          <ngx-status-result
            (finished)="getData()"
            (clicked)="exit()"
            [description]="reportUnreadyDataMap[reportUnreadyType()!].message"
            [timer]="reportUnreadyType() === 'COUNTDOWN' ? timer : {}"
            [type]="'Waiting'"
            [title]="reportUnreadyDataMap[reportUnreadyType()!].title"
            [buttons]="buttons()"
          >
            <ng-container status-image>
              @if (reportUnreadyType() !== 'EXIT') {
                <ngx-waiting-stepper
                  [isSelfProgress]="true"
                  [timerDeadline]="timer.timeInSeconds"
                  [state]="waitingStepperState()"
                ></ngx-waiting-stepper>
              } @else {
                <div [class]="'status-image'"></div>
              }
            </ng-container>
          </ngx-status-result>
        </div>
      </app-credit-scrollable-view>
    </div>
  </div>
}
@if (showReportPage()) {
  <app-credit-scoring-step-report-wrapper
    class="d-flex flex-column flex-grow"
    [trackingCode]="trackingCode()"
    [type]="'without-pay'"
    (back)="showReportPage.set(false)"
  ></app-credit-scoring-step-report-wrapper>
}
