<app-credit-app-bar
  (onBackButtonClick)="backButtonClicked()"
  [backButton]="true"
  title="جزئیات پرداخت"
></app-credit-app-bar>

<div class="page-content">
  <div >
    <app-credit-installment-card
      [amount]="installment()?.amount"
      [color]="wallet()?.color"
      [date]="installmentDate()!"
      [imageId]="imageId()!"
      [netAmount]="installment()?.netAmount"
      [penaltyAmount]="installment()?.penaltyAmount"
      [title]="installment()?.persianNumber"
    ></app-credit-installment-card>

    <div class="buttons">
      <ngx-button
        (click)="confirmed()"
        [isLoading]="paying()"
        [disabled]="paying()"
      >
        <span>تائید و پرداخت</span>
      </ngx-button>
    </div>
  </div>
</div>
