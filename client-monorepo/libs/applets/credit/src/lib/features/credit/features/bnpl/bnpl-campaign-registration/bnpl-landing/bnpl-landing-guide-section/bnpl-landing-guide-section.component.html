<section class="section-with-padding">
  <div class="container">
    <div class="megaphone-image"></div>
    <div class="guide-section-title">{{ title }}</div>
    <ul class="faq_items d-flex flex-column">
      @for (box of boxList; track box) {
        <li class="faq_item collapsible">
          <div
            (click)="openItemFaq(box)"
            class="faq_question"
          >
            <span>{{ box.title }}</span>
            <ngx-icon
              [name]="'arrow-2-up'"
              [iconSize]="'24px'"
              [class]="!box.open ? 'rotate' : ''"
            ></ngx-icon>
          </div>
          @if (box.open) {
            <div class="faq_answer">
              {{ box.description }}
            </div>
          }
        </li>
      }
    </ul>
  </div>
</section>
