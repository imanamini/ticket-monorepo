<app-credit-app-bar
  (onBackButtonClick)="goBack.emit()"
  [backButton]="true"
  title="امضای دیجیتال"
>
</app-credit-app-bar>
<div class="flex-grow d-flex flex-column">
  <div class="d-flex flex-grow d-flex justify-content-center rtl pb-plus">
    <ngx-status-result
      [type]="'Status'"
      [iconState]="'error'"
      [description]="errorDescription()"
      [title]="errorText()"
      [buttons]="buttons()"
      (clicked)="onClick($event)"
    >
    </ngx-status-result>
  </div>
</div>
