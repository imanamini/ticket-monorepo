<div class="d-flex flex-column flex-grow">
  <div class="d-flex flex-column flex-grow rtl px-plus align-items-center justify-content-center">
    <div class="t-3 text-onback-high text-align-center">{{ password() }}</div>
    <p class="st-3 text-onback-high text-align-center">رمز امضای دیجیتال با موفقیت ثبت شد</p>
    <div class="b-2 text-onback-medium mb-big text-align-center">
      این رمز را کپی کنید و در جایی امن نگه دارید تا در زمان امضای اسناد و مدارک از آن استفاده کنید.
    </div>
    <ngx-button
      (clickHandler)="copy()"
      [size]="'large'"
      ngxTrackableId
      mode="section"
      [rightIcon]="{ name: 'document-copy' }"
      trackerId="digitalSignaturePasswordCopyButton"
      [style]="'tinted-on-elevated'"
      >کپی رمز
    </ngx-button>
  </div>

  <div class="d-flex flex-column gap-big w-100 rtl px-plus pt-huge pb-mega">
    <div class="d-flex rtl">
      <ngx-checkbox [(checked)]="accepted">
        <span class="b-2 text-onback-medium">رمز امضای دیجیتال را دیدم و به خاطر سپردم.</span>
      </ngx-checkbox>
    </div>
    <ngx-button
      ngxTrackableId
      trackerId="digitalSignaturePasswordCopyConfirmButton"
      (click)="onSubmit()"
      [disabled]="loading() || !accepted()"
      [fullWidth]="true"
      [isLoading]="loading()"
      [style]="'fill'"
      >تایید و ادامه
    </ngx-button>
  </div>
</div>
