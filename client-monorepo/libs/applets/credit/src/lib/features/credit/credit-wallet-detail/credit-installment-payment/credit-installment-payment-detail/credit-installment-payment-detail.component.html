<app-credit-app-bar
  (onBackButtonClick)="goBack()"
  [backButton]="true"
  title="جزییات پرداخت"
></app-credit-app-bar>
<div class="main-section flex-full-height">
  <div class="top-section">
    <app-credit-scrollable-view>
      <div class="page-content">
        <app-credit-payment-card
          [amount]="+amount()"
          [detailsTitle]="installmentPayConfig().descriptionTitle"
          [details]="descriptions()"
          [imageId]="installmentPayConfig().icon"
          [title]="installmentPayConfig().title"
        ></app-credit-payment-card>
      </div>
    </app-credit-scrollable-view>
  </div>
  <div class="call-to-action-section">
    @if (installmentPayConfig().hintMessage) {
      <div class="hint-message-wrapper">
        <ngx-callout
          [mode]="'single-without-title'"
          [message]="installmentPayConfig().hintMessage"
        />
      </div>
    }
    <ngx-button
      (click)="goForward()"
      [disabled]="paying() || amount() === 0"
      [fullWidth]="true"
      [isLoading]="paying()"
      [brandButton]="true"
    >
      تایید و پرداخت
    </ngx-button>
  </div>
</div>
