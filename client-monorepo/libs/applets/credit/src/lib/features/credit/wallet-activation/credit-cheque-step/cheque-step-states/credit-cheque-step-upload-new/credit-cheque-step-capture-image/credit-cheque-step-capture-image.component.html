<app-credit-app-bar
  (onBackButtonClick)="close.emit()"
  [backButton]="true"
  title="عکاسی از چک"
></app-credit-app-bar>
@if (!showLoading()) {
  <div class="d-flex flex-column flex-grow rtl">
    @switch (state()) {
      @case ('INITIAL') {
        <app-credit-cheque-step-camera-permission
          (close)="close.emit()"
          (accessRequest)="requestCamera()"
        ></app-credit-cheque-step-camera-permission>
      }
      @case ('GRANTED') {
        <app-credit-cheque-step-camera-capture (confirm)="onConfirm($event)"></app-credit-cheque-step-camera-capture>
      }
      @case ('DENIED') {
        <app-credit-cheque-step-camera-access-denied (close)="close.emit()"></app-credit-cheque-step-camera-access-denied>
      }
    }
  </div>
} @else {
  <credit-page-loading [active]="showLoading()"></credit-page-loading>
}
