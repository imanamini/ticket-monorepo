<app-credit-app-bar
  (onBackButtonClick)="close.emit()"
  [backButton]="true"
  title="امضا آنلاین اسناد"
>
</app-credit-app-bar>
<div class="main-section d-flex flex-column justify-content-center">
  <div class="flex-grow d-flex justify-content-center rtl pb-plus">
    <ngx-status-result
      (clicked)="close.emit()"
      [buttons]="buttons"
      [description]="errorDescription"
      [title]="errorText"
      [type]="'Status'"
      [iconState]="'error'"
    >
    </ngx-status-result>
  </div>
</div>
