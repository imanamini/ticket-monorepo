<app-credit-app-bar
  (onBackButtonClick)="close.emit()"
  (onTextClick)="onActionClick()"
  [actionImage]="'info-circle'"
  [backButton]="true"
  actionText="راهنما"
  [title]="'چک ضمانت'"
></app-credit-app-bar>
<app-credit-stepper
  [currentStep]="4"
  [steps]="5"
  [title]="title()"
></app-credit-stepper>
<div class="d-flex flex-column flex-grow rtl">
  <div class="d-flex flex-column flex-grow">
    <app-credit-scrollable-view [fullHeightContent]="true">
      <div class="d-flex flex-column flex-grow pt-plus px-plus gap-big rtl">
        <div
          (click)="openImageDialog()"
          class="image radius-plus mx-auto surface-back"
          ngxTrackableId
          trackerId="openChequeImageDialogClick"
        >
          <ngx-badge
            [hasIcon]="true"
            class="error-badge"
            mode="bold"
            size="md"
            status="error"
            type="text"
          >
            چک تایید نشد
            <ng-container badge-icon>
              <ngx-icon
                [name]="'info-circle'"
                class="text-oninvert-high"
              ></ngx-icon>
            </ng-container>
          </ngx-badge>
          @if (document()?.docId) {
            <div class="image-container mx-auto">
              <credit-digipay-image
                [imageId]="document()?.docId"
                apiEndpoint="CREDIT"
                width="auto"
                height="100%"
              ></credit-digipay-image>
            </div>
          }
        </div>
        <div class="d-flex flex-column w-100 gap-small">
          <p class="st-6 text-onback-medium">دلایل رد چک</p>
          <div class="d-flex flex-column w-100 radius-medium p-plus gap-medium border-300 border-color-light">
            @for (item of reasons(); track item; let index = $index; let last = $last) {
              <div class="d-flex flex-column w-100">
                @if (item.type !== 'others') {
                  <div class="st-8 text-onback-high">
                    {{ item.title }}
                  </div>
                }
                @if (item.description) {
                  <div class="b-2 text-onback-medium">
                    {{ item.description }}
                  </div>
                }
              </div>
              @if (!last) {
                <ngx-divider
                  [color]="BorderColorsEnum.Air"
                  orientation="horizontal"
                ></ngx-divider>
              }
            }
          </div>
        </div>
        <ngx-callout
          [messages]="calloutMessages()"
          [mode]="'multiple'"
          [title]="'نکات مهم'"
        ></ngx-callout>
      </div>
    </app-credit-scrollable-view>
  </div>
  <div class="pt-small pb-plus px-plus d-flex flex-column mt-big">
    <ngx-button
      (clickHandler)="onSubmit()"
      [fullWidth]="true"
      [style]="'fill'"
      ngxTrackableId
      trackerId="chequeCorrectButtonClick"
      >اصلاح چک
    </ngx-button>
  </div>
</div>
