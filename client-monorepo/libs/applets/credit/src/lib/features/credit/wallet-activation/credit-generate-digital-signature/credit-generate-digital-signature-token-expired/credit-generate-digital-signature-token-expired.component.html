<app-credit-app-bar
  (onBackButtonClick)="resetDigitalSignatureToken()"
  [backButton]="true"
  [title]="'ساخت امضای دیجیتال'"
></app-credit-app-bar>
<div class="flex-grow d-flex flex-column">
  <div class="flex-grow d-flex justify-content-center rtl pb-plus">
    <ngx-status-result
      [type]="'Status'"
      [iconState]="'error'"
      [description]="description"
      [title]="title"
      [buttons]="buttons"
      (clicked)="resetDigitalSignatureToken()"
    >
    </ngx-status-result>
  </div>
</div>
