<div class="bottom-sheet-container d-flex flex-column">
  <ngx-bottom-sheet-header
    [showResizable]="true"
    [title]="'راهنمای فعالسازی دوربین'"
  ></ngx-bottom-sheet-header>
  <div class="p-plus">
    <div class="p-plus d-flex flex-column gap-big w-100 radius-plus border-300 border-color-light mb-big">
      <div class="d-flex flex-row w-100 align-items-center gap-minus">
        <div [class]="'image-container radius-big border-300 border-color-air p-small ' + userAgent()"></div>
        <div class="d-flex flex-column">
          <span class="st-7 text-onback-high">{{ translateUserAgent() }}</span>
          <span class="c-3 text-onback-medium">کاربران {{ translateUserDeviceType() }}</span>
        </div>
      </div>
      <div class="p-minus radius-plus surface-back ltr text-align-left b-2 text-onback-medium">{{ accessPath() }}</div>
      @if (showNotice()) {
        <ngx-callout
          [mode]="'single-with-title'"
          [message]="
            'اگر تنظیمات به درستی اعمال شده است، با بازگشت به صفحه قبل در اپلیکیشن دیجی‌پی، دسترسی به دوربین را دوباره تایید کنید.'
          "
        />
      }
    </div>
    <ngx-button
      (clickHandler)="onClose()"
      [fullWidth]="true"
      [style]="'fill'"
      ngxTrackableId
      trackerId="cameraAccessGuidButtonClick"
      >متوجه شدم
    </ngx-button>
  </div>
</div>
