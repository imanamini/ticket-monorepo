<app-credit-app-bar
  (onBackButtonClick)="close.emit()"
  [backButton]="true"
  title="دریافت فیزیک چک"
></app-credit-app-bar>
<div class="d-flex flex-column flex-grow rtl">
  <div class="flex-grow pb-plus">
    <ngx-status-result
      (clicked)="onClick()"
      [buttons]="buttons()"
      [description]="data().description"
      [title]="data().title"
      [type]="'Status'"
      [iconState]="'done'"
    >
    </ngx-status-result>
  </div>
</div>
