<div class="card-container">
  @if (title()) {
    <div class="card-header">
      @if (title()) {
        <div class="text-onback-high st-8">{{ title() }}</div>
      }
    </div>
  }
  <div
    [class]="{ 'is-single': !title() }"
    class="card-body"
  >
    <ng-content></ng-content>
  </div>
</div>
