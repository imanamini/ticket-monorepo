@if (!expired()) {
  <app-credit-password-signature
    (keyboardFire)="onKeyBoardHitError()"
    (pinChange)="clearError()"
    (submitted)="handleToSubmit($event)"
    [errorText]="errorText()"
    [loading]="loading()"
    class="full-height"
    description="رمز امضای دیجیتال خود را وارد کنید"
  >
  </app-credit-password-signature>
} @else {
  <div class="rtl d-flex flex-column justify-content-center align-items-center flex-grow">
    <div class="flex-grow d-flex justify-content-center rtl pb-plus">
      <ngx-status-result
        (clicked)="close($event)"
        [buttons]="buttons()"
        [description]="errorDescription()"
        [title]="errorText()"
        [type]="'Status'"
        [iconState]="'error'"
      >
        @if (cancelActivation()) {
          <div
            html-content
            class="d-flex flex-column flex-grow justify-content-flex-end"
          >
            <ngx-alert
              [color]="'yellow'"
              [hasCloseIcon]="false"
              [text]="'لطفا ابتدا درخواست وام فعلی خود را لغو کنید و سپس برای دریافت وام دوباره اقدام نمایید.'"
            />
          </div>
        }
      </ngx-status-result>
    </div>
  </div>
}
