@if (!loading()) {
  <app-credit-app-bar
    (onBackButtonClick)="close.emit()"
    [backButton]="true"
    title="طرح های اعتبار بانکی"
  >
  </app-credit-app-bar>
  <div class="d-flex flex-column flex-grow">
    <div class="flex-grow justify-content-center pb-plus">
      <ngx-status-result
        (clicked)="close.emit()"
        [buttons]="buttons"
        [description]="description"
        [title]="title"
        [type]="'Empty'"
      >
        <ng-container status-image>
          <div class="message-image"></div>
        </ng-container>
      </ngx-status-result>
    </div>
  </div>
} @else {
  <credit-page-loading [active]="loading()"></credit-page-loading>
}
