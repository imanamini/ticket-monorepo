<div class="used-health-check-result d-flex flex-column align-items-center justify-content-center">
  <journey-action-result
          [data]="actionResultData">
    با عرض پوزش! با توجه به تست سلامت انجام شده، دستگاه شما تحت پوشش بیمه قرار نمی‌گیرد!
  </journey-action-result>

  <div class="button">
    <journey-buttons
            (nextClicked)="goToStepper()"
            [disableNext]="false"
            [hideBackBtn]="true"
            [idValue]="'used-health-check-result'"
            [isReversed]="false"
            nextText="تلاش مجدد">
    </journey-buttons>
  </div>

</div>
