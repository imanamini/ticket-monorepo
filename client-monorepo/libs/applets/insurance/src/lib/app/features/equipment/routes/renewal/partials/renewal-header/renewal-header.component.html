<div
  *ngIf="isMobile"
  class="steps-mobile-header"
>
  <div class="title-wrapper">
    @if (showBackBtn) {
      <ngx-icon
        (click)="handleBackClick($event)"
        [type]="'linear'"
        [iconSize]="'24px'"
        [name]="closeIconName()"
        class="cursor-pointer"
      ></ngx-icon>
    }
    <span class="page-title">
      {{ journey === JourneyNamesModel.RENEWAL ? 'تمدید بیمه نامه' : 'صدور بیمه نامه' }}
    </span>
  </div>

</div>
