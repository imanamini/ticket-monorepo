<div class="payment-result d-flex flex-column align-items-center justify-content-space-between px-plus pb-plus h-100 w-100 surface-elevated">
  <div class="d-flex flex-column align-items-center gap-huge">
    <div class="check-wrapper d-flex align-items-center justify-content-center p-plus radius-rounded surface-back">
      <ngx-icon [name]="'error-circle'" [type]="'bold'"
                [class]="'text-onback-warning'"
                [iconSize]="'48px'"></ngx-icon>
    </div>
    <div class="d-flex flex-column gap-micro">
      <div class="title st-3 text-onback-high text-align-center">در حال خروج از فرآیند خرید بیمه هستید.</div>
      <div class="subtitle b-2 text-onback-medium text-align-center">برای صدور بیمه‌‌نامه لازم است مراحل بعدی را تکمیل
        کنید.
      </div>
    </div>
  </div>
  <div>
    <div class="d-flex flex-column gap-huge">
      <ins-alert
              [text]="'در صورت عدم تکمیل اطلاعات ظرف ۷۲ ساعت آینده، وجه پرداختی به کیف پول شما باز خواهد گشت.'"
              [color]="AlertColorEnum.Yellow"
              [icon]="'error-circle'"
              [hasIcon]="true"
      ></ins-alert>
      <div class="d-flex align-items-center justify-content-space-between gap-minus">
        <ins-button
                [text]="'خروج'"
                [style]="InsButtonStyleEnum.TintedOnElevated"
                [size]="InsButtonSizeEnum.Large"
                [fullWidth]="true"
                (clickHandler)="leaveJourney()"
        ></ins-button>
        <ins-button
                [text]="'تکمیل مراحل'"
                [style]="InsButtonStyleEnum.Fill"
                [size]="InsButtonSizeEnum.Large"
                [fullWidth]="true"
                (clickHandler)="continueJourney()"
        ></ins-button>
      </div>
    </div>
  </div>
</div>
