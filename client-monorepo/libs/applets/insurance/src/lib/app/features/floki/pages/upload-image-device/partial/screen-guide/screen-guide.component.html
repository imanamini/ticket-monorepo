<div class="d-flex flex-column w-100 health-check-wrapper guide-container">
  <div class="d-flex align-items-center header">
    <floki-header
      (iconClickHandler)="closeBottomSheet()"
      [hasIcon]="true"
      [iconName]="'close'"
      [title]="'نمونه تصاویر قابل پذیرش'"
      class="icon-color"
      titleTextAlign="center"
    >
    </floki-header>
  </div>

  <div class="px-plus image-container">
    <div class="st-8 text-onback-high">
      گوشی با یک صفحه نمایش
    </div>

    <div class="d-flex py-minus align-items-center justify-content-space-between">
      <image-guide [imageAddress]="'assets/images/Rectangle5.png'" [label]="'تصویر پشت دستگاه'">
      </image-guide>

      <image-guide [imageAddress]="'assets/images/Rectangle2.png'" [label]="'تصویر روی دستگاه با IMEI'">
      </image-guide>
    </div>

    <div class="st-8 text-onback-high">
      گوشی با دو صفحه نمایش
    </div>

    <div class="d-flex py-minus align-items-center justify-content-space-between">
      <image-guide [imageAddress]="'assets/images/Rectangle2.png'" [label]="'تصویر روی دستگاه با IMEI'">
      </image-guide>

      <div class="d-flex flex-column gap-small align-items-center justify-content-space-between">
        <image-guide [imageAddress]="'assets/images/Rectangle3.png'" [label]="'تصویر پشت دستگاه'">
        </image-guide>
        <image-guide [imageAddress]="'assets/images/Rectangle4.png'" [label]="'تصویر صفحه نمایش دوم'">
        </image-guide>
      </div>
    </div>
  </div>

  <div class="p-plus">
    <ngx-button
      (click)="closeBottomSheet()"
      [fullWidth]="true"
      [size]="'large'"
      [style]="'fill'">
      متوجه شدم
    </ngx-button>
  </div>
</div>
