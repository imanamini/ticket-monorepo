<div class="payment-result d-flex flex-column align-items-center justify-content-space-between px-plus pb-plus h-100 w-100 surface-elevated">
  <div class="d-flex flex-column align-items-center gap-huge w-100">
    <div class="check-wrapper d-flex align-items-center justify-content-center p-plus radius-rounded surface-back">
      <ngx-icon [name]="'check-circle'" [type]="'bold'"
                [class]="'text-onback-success'"
                [iconSize]="'48px'"></ngx-icon>
    </div>
    <div class="d-flex flex-column gap-micro w-100">
      <div class="title st-3 text-onback-high text-align-center">بیمهٔ شما، با موفقیت صادر شد!</div>
      <div class="subtitle b-2 text-onback-medium text-align-center">می‌توانید بیمه‌نامه جدید خود را دریافت کنید.</div>
      <div class="d-flex flex-column gap-minus mt-hulk w-100">
        <ins-button
                text="دانلود و مشاهده سند"
                [size]="InsButtonSizeEnum.Large"
                [style]="InsButtonStyleEnum.Fill"
                [fullWidth]="true"
                [rightIcon]="{name: 'download',type: 'linear'}"
                (clickHandler)="downloadPolicy()"
                [isLoading]="isDownloading()"
        ></ins-button>
        <ins-button
                (clickHandler)="navigateToPolicyList()"
                text="بیمه‌نامه‌های من"
                [size]="InsButtonSizeEnum.Large"
                [style]="InsButtonStyleEnum.TintedOnElevated"
                [fullWidth]="true"
        ></ins-button>
      </div>
    </div>
  </div>
</div>
