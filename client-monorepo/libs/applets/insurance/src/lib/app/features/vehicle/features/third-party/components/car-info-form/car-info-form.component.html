<form [formGroup]="carInfoForm()"
      class="car-info-form">
  <ui-form-field [errorMessageMapper]="errorMapper"
                 [error]="carInfoForm()?.controls?.type?.errors"
                 [options]="types"
                 [readonly]="carInfoForm()?.controls?.type?.disabled"
                 [searchable]="false"
                 [showError]="showError()?'show':'hidden'"
                 [overflowToContainer]="true"
                 [showRadioOptions]="showRadioButton"
                 selectOpenType="auto"
                 formControlName="type"
                 label="نوع"
                 placeholder="مثال: سواری"
                 type="select"></ui-form-field>

  @if (showUsage()) {
    <ui-form-field [readonly]="carInfoForm()?.controls?.usage?.disabled"
                   [error]="carInfoForm()?.controls?.usage?.errors"
                   [showError]="showError()?'show':'hidden'"
                   [errorMessageMapper]="errorMapper"
                   [searchable]="false"
                   [options]="usages"
                   [overflowToContainer]="true"
                   [showRadioOptions]="showRadioButton"
                   selectOpenType="auto"
                   type="select"
                   label="کاربری"
                   placeholder="مثال: شخصی"
                   formControlName="usage"></ui-form-field>
  }

  <div class="brand-model-box">
    <ui-form-field [errorMessageMapper]="errorMapper"
                   [error]="carInfoForm()?.controls?.brand?.errors"
                   [options]="brands"
                   [readonly]="carInfoForm()?.controls?.brand?.disabled"
                   [searchable]="true"
                   [showError]="showError()?'show':'hidden'"
                   [overflowToContainer]="true"
                   [showRadioOptions]="showRadioButton"
                   selectOpenType="auto"
                   formControlName="brand"
                   label="برند"
                   placeholder="جستجو..."
                   [ngxTooltip]="carInfoForm()?.controls?.brand?.value | getTitle:brands"
                   tooltipType="hover"
                   tooltipPosition="top"
                   type="select"></ui-form-field>

    <ui-form-field [errorMessageMapper]="errorMapper"
                   [error]="carInfoForm()?.controls?.model?.errors"
                   [options]="models"
                   [readonly]="carInfoForm()?.controls?.model?.disabled || models?.length === 0"
                   [searchable]="true"
                   [showError]="showError()?'show':'hidden'"
                   [overflowToContainer]="true"
                   [showRadioOptions]="showRadioButton"
                   selectOpenType="auto"
                   formControlName="model"
                   label="مدل/ تیپ"
                   placeholder="جستجو..."
                   [ngxTooltip]="carInfoForm()?.controls?.model?.value | getTitle:models"
                   tooltipType="hover"
                   tooltipPosition="top"
                   type="select"></ui-form-field>
  </div>
  <ui-form-field [errorMessageMapper]="errorMapper"
                 [error]="carInfoForm()?.controls?.buildYear?.errors"
                 [options]="years"
                 [searchable]="true"
                 [showError]="showError()?'show':'hidden'"
                 [overflowToContainer]="true"
                 [showRadioOptions]="showRadioButton"
                 selectOpenType="auto"
                 formControlName="buildYear"
                 label="سال ساخت/مدل"
                 placeholder="جستجو..."
                 type="select"></ui-form-field>
</form>
