<div
  class="d-flex w-100 align-items-center gap-small border-300 card-container radius-medium p-minus border-color-disabled surface-high-contrast"
  [ngClass]="{'flex-row-reverse justify-content-flex-end': radioButtonPosition() === 'right',
    'justify-content-space-between': radioButtonPosition() === 'left' }"
  [class.selected]="isChecked()" (click)="handleChecked()">

  @if (iconName()) {
    <div class="p-pony surface-back radius-small">
      <ngx-icon [name]="iconName()"></ngx-icon>
    </div>
  }

  <div class="d-flex flex-column gap-tiny">
    <div class="bt-2">{{ title() }}</div>
    <div class="c-3">{{ subTitle() }}</div>
  </div>

  <div class="selection">
    <input
      [checked]="isChecked()"
      (click)="handleChecked($event)"
      type="checkbox"
    />
  </div>

</div>
