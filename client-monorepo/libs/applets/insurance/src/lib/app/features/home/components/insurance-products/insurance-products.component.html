<div class="d-flex flex-column gap-minus">
  <div class="d-flex gap-small align-items-center">
    <span class="st-8 text-onback-high cursor-pointer">خدمات بیمه</span>
  </div>
  <div class="d-flex  flex-column align-items-center justify-content-space-between radius-big gap-small">
    @for (product of insuranceProducts(); track product.type) {
      <div
        class="product p-small surface-elevated w-100 d-flex flex-row gap-small align-items-center justify-content-space-between cursor-pointer radius-medium"
        [attr.data-tracking-id]="'select-app-' + product.type"
        (click)="navigate(product)">
        <div class="d-flex flex-row gap-small align-items-center justify-content-center">
          @defer (on viewport) {
            <div
              style="position: relative; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px;">
              <div
                class="d-flex align-items-center justify-content-center surface-back radius-medium"
                style="width: 45px; height: 45px;position: absolute"></div>
              <img [ngSrc]="product.logo"
                   [alt]="product.title"
                   [title]="product.title"
                   [width]="56"
                   [height]="56"
                   [loading]="'lazy'"
                   style="z-index: 2;"/>
            </div>
          } @placeholder () {
            <lib-ngx-skeleton-loading [loadingEffect]="true" width="80px" height="80px"></lib-ngx-skeleton-loading>
          }
          <span class="st-8 text-onback-high">{{ product.title }}</span>
        </div>
        <div class="d-flex flex-row align-items-center justify-content-between gap-small">
          @if (product.badge) {
            <div class="d-flex h-100 align-items-center justify-content-center">
              <ngx-badge size="sm" mode="bold" [status]="product.badge.status">{{ product.badge.text }}</ngx-badge>
            </div>
          }
          <div>
            <ngx-icon name="arrow-2-left" type="linear"></ngx-icon>
          </div>
        </div>
      </div>
    }
  </div>
</div>
