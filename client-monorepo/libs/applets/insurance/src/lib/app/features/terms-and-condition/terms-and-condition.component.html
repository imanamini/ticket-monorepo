<div class="terms-and-condition h-100">
  <main-header
          title="شرایط و مقررات استفاده بیمه"
          (rightIconClicked)="backClicked()"
  ></main-header>
  <div class="container px-medium pb-hulk">
    <div class="foreword st-6 text-onback-high py-big">
      {{ TERMS_DATA.foreword }}
    </div>
    <div class="d-flex flex-column gap-big">
      @for (item of TERMS_DATA.items; track $index) {
        <div>
          <div class="st-6 text-onback-high">{{ item.title }}</div>
          <ul class="clauses pt-pony pr-big">
            @for (clause of item.clauses; track $index) {
              <li class="st-8">{{ clause }}</li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
  <div class="cta">
    <ins-button
            text="خواندم"
            [style]="InsButtonStyleEnum.Fill"
            [size]="InsButtonSizeEnum.Large"
            [mode]="InsButtonModeEnum.Form"
            [fullWidth]="true"
            (clickHandler)="backClicked()"
    ></ins-button>
  </div>
</div>
