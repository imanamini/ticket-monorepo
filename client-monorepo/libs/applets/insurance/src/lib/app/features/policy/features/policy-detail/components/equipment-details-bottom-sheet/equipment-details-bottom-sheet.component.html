<div class="equipment-details-bottom-sheet">
  <div class="d-flex flex-column gap-big align-items-center justify-content-center p-medium">
    <div
            (click)="downloadReceipt()"
            class="d-flex gap-small align-items-center justify-content-start w-100 cursor-pointer">
      <ngx-icon
              name="receipt-bill"
              iconSize="24px"></ngx-icon>
      <div>دانلود رسید وصول حق بیمه</div>
    </div>
    <div
            (click)="transferOwnership()"
            class="d-flex gap-small align-items-center justify-content-start w-100 cursor-pointer">
      <ngx-icon
              name="change"
              iconSize="24px"></ngx-icon>
      <div>انتقال بیمه‌نامه</div>
    </div>
  </div>
</div>
