<div class="product-card surface-elevated d-flex flex-column radius-plus">
  <div class="d-flex flex-row p-medium gap-small align-items-center justify-content-start border-color-light border-b-300">
    <div class="surface-back p-small radius-minus d-flex align-items-center justify-content-center">
      <ins-icon [name]="productCardDetail()?.insurerParty.logo"
                [height]="32"
                [width]="32"></ins-icon>
    </div>
    <div class="d-flex flex-column gap-low">
      <div class="st-8 text-onback-high">{{ productCardDetail().title }}</div>
      <div class="c-3 text-onback-medium">{{ 'بیمه ' + productCardDetail().insurerParty.name }}</div>
    </div>
  </div>
  <div class="mt-medium d-flex flex-row px-medium align-items-center justify-content-space-between">
    <div class="st-8 text-onback-low">
      حق بیمه سالیانه:
    </div>
    <div class="d-flex gap-low align-items-center text-onback-medium">
      <div class="t-6">
        {{ productCardDetail().payableAmount | thousands }}
      </div>
      <div class="st-8">
        ریال
      </div>
    </div>
  </div>
  <div class="d-flex flex-row p-medium align-items-center justify-content-space-between mt-small gap-small">
    <ins-button
            (clickHandler)="onCoverageDetailButtonClick.emit(productCardDetail())"
            class="flex"
            text="جزییات پوشش"
            [style]="InsButtonStyleEnum.TintedOnElevated"
            [fullWidth]="true"
            [size]="InsButtonSizeEnum.Large"
    ></ins-button>
    <ins-button
            (clickHandler)="onOrderProductClick.emit(productCardDetail())"
            class="flex"
            text="سفارش"
            [style]="InsButtonStyleEnum.Fill"
            [fullWidth]="true"
            [size]="InsButtonSizeEnum.Large"
    ></ins-button>
  </div>
</div>
