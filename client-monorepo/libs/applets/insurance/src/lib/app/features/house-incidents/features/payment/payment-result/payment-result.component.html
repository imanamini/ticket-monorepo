@if (isLoading()) {
  <div class="w-100 h-100 d-flex align-items-center justify-content-center">
    <ngx-spinner size="xl"></ngx-spinner>
  </div>
} @else {
  <div class="d-flex flex-column align-items-center justify-content-start w-100 h-100">
    <div class="surface-elevated w-100">
      <main-header title="انتخاب بیمه"
                   (rightIconClicked)="backButtonClicked()"
                   leftIconName="headphone"
                   [faqCategory]="FaqCategoryTypeEnum.HOUSE_INCIDENTS"
                   leftIconType="linear"
                   [is-close-mode]="true"
      ></main-header>
    </div>
    <div
            class="payment-result d-flex flex-column align-items-center justify-content-space-between px-plus pb-plus w-100 surface-elevated">
      <div class="d-flex flex-column align-items-center gap-huge">
        <div class="check-wrapper d-flex align-items-center justify-content-center p-plus radius-rounded surface-back">
          <ngx-icon [name]="isSuccess() ? 'check-circle' : 'close-circle'" [type]="'bold'"
                    [class]="isSuccess() ? 'text-onback-success' : 'text-onback-error'"
                    [iconSize]="'48px'"></ngx-icon>
        </div>
        <div class="d-flex flex-column gap-micro">
          <div
                  class="title st-3 text-onback-high text-align-center">{{ isSuccess() ? successDetail().title : failedDetail().title }}
          </div>
          <div
                  class="subtitle b-2 text-onback-medium text-align-center">{{ isSuccess() ? successDetail().subtitle : failedDetail().subtitle }}
          </div>
          @if (!isSuccess()) {
            <ins-button
                    (clickHandler)="retryPayment()"
                    class="mt-massive"
                    text="تلاش مجدد"
                    [size]="InsButtonSizeEnum.Large"
                    [style]="InsButtonStyleEnum.Fill"
                    [fullWidth]="true"
            ></ins-button>
          }
        </div>
      </div>
      <div>
        @if (isSuccess()) {
          <div class="d-flex flex-column gap-huge">
            <ins-alert
                    [text]="successDetail().notifyMessage"
                    [color]="AlertColorEnum.Yellow"
                    [icon]="'error-circle'"
                    [hasIcon]="true"
            ></ins-alert>
            <div>
              <ins-button
                      (clickHandler)="completeUserInfo()"
                      [text]="'تکمیل اطلاعات'"
                      [style]="InsButtonStyleEnum.Fill"
                      [size]="InsButtonSizeEnum.Large"
                      [fullWidth]="true"
              ></ins-button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
