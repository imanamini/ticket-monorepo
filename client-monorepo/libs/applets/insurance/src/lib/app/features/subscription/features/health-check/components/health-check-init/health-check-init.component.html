<ng-container>
  <div class="health-check-init d-flex flex-column align-items-center justify-content-center text-onback-medium">
    <div class="init-title">
      شروع فرآیند تست
    </div>
    <div class="init-text">
      با تایید این صفحه، فرآیند تست صفحه لمسی دستگاه شما شروع خواهد شد. سعی کنید تمام مربع ها را با لمس کردن رنگی کنید.
    </div>
    <ui-button
            (click)="closeDialog(true)">
      <span>تایید</span>
    </ui-button>
  </div>
</ng-container>
