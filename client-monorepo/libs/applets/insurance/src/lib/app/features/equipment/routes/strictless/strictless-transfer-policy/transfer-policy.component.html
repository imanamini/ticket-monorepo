<ng-container [ngSwitch]="currentStep">
  <ng-container *ngSwitchCase="0">
    <div
      *ngIf="!errorMessage; else errorBox"
      class="loader-container"
    >
      <ui-loading-spinner></ui-loading-spinner>
    </div>

    <ng-template #errorBox>
      <div class="error-container">
        <div class="error-content">
          <img
            class="illustration"
            src="insurance-assets/images/error-transfer-detail.png"
          />
          <p class="error-title">مشکلی رخ داده‌است!</p>
          <p class="error-description">{{ errorMessage }} لطفا با پشتیبانی برای پیگیری وضعیت تماس بگیرید.</p>
          <p class="call-center">۰۲۱ - ۲۴۳۴۴۵۳۴</p>
          <div class="button-wrapper">
            <ui-button
              (click)="goToHomePage()"
              appearance="BLUE-TEXT"
            >
              بازگشت به صفحه اصلی
            </ui-button>
          </div>
        </div>
      </div>
    </ng-template>
  </ng-container>

  <div
    *ngSwitchCase="1"
    class="register-container"
  >
    <div class="register-content">
      <electronic-equipment-register (submitted)="registerSubmitted($event)"> </electronic-equipment-register>
    </div>
  </div>
</ng-container>
