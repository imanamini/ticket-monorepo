<div class="hint-container">
  <div class="screens">
    <div class="info-container">
      <img alt="" class="info-box-blue" height="24 " src="insurance-assets/icons/info-box-blue.svg" width="24">
      <p>نمونه تصاویر قابل پذیرش برای گوشی با یک صفحه نمایش</p>
    </div>
    <div class="cards">
      @for (item of cardsOneScreen; track item.src) {
        <guide-card [config]="item"></guide-card>
      }
    </div>
  </div>

  <div class="screens">
    <div class="info-container">
      <img alt="" class="info-box-blue" height="24px " src="insurance-assets/icons/info-box-blue.svg" width="24px">
      <p>نمونه تصاویر قابل پذیرش برای گوشی با دو صفحه نمایش</p>
    </div>
    <div class="cards">
      @for (item of cardsTwoScreen; track item.src) {
        <guide-card [config]="item"></guide-card>
      }
    </div>
  </div>
</div>
