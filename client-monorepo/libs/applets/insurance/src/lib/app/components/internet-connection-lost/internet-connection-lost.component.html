<div class="internet-connection-lost flex-column justify-content-center align-items-center w-100 h-100"
     [class.show]="isOffline()">
  <div class="content d-flex flex-column align-items-center justify-content-center h-100 px-plus">
    <img src="insurance-assets/new-assets/images/lightning-icon.png"
         alt="lightning icon">
    <div class="d-flex flex-column align-items-center gap-small">
      <span class="st-3 text-oninvert-high text-align-center">خطای دسترسی به اینترنت</span>
      <p class="b-2 text-oninvert-high text-align-center"> به اینترنت متصل نیستید، برای استفاده از برنامه باید به
        اینترنت وصل شوید.</p>
    </div>
  </div>
</div>
