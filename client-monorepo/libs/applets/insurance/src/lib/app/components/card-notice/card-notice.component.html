<div class="card-notice">
  <div *ngIf="title" class="title tab">
    <span icon="icon-hints" [size]="24" ui-icon></span>
    <div class="text">
      {{ title }}
    </div>
  </div>
  <ul *ngIf="notices && notices.length > 0" class="items">
    <li *ngFor="let notice of notices" [ngClass]="hasDots ? 'chains' : ''">
      <span icon="icon-hint" [size]="16" ui-icon></span>
      <span class="text b-3">
        {{ notice[ textKey ] ?? notice }}
      </span>
    </li>
  </ul>
</div>
