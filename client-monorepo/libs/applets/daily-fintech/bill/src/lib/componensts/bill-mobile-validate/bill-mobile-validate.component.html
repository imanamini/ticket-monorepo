<div class="page-content px-medium py-big">
  <form [formGroup]="billInquiryForm">
    <span class="header-text b-2">
      با وارد کردن <span class="header-text-bold st-8">شماره همراه</span> ، قبض موبایل خود را استعلام و پرداخت نمایید.
    </span>
    <div class="form-group mt-minus">
      <ui-form-field
        [error]="billInquiryForm.controls['cellNumber'].errors"
        [hasCleaner]="true"
        [isNumericKeyboard]="true"
        class="flex-grow"
        formControlName="cellNumber"
        inputType="tel"
        placeholder="مثال: ۴۵۶۷ ۱۲۳ ۰۹۱۲"
        label="شماره همراه"
        [maxSize]="11"
        type="input"
      >
      </ui-form-field>

      <div class="button-container mt-huge">
        <ngx-button
          [mode]="'form'"
          (clickHandler)="confirmNavigation()"
          [size]="'large'"
          [disabled]="billInquiryForm.invalid || !this.billInquiryForm.controls['cellNumber'].value || isSubmitting()"
          [isLoading]="isSubmitting()"
          [style]="'fill'"
          [fullWidth]="true"
        >
          ذخیره و استعلام
        </ngx-button>
      </div>
    </div>
  </form>
  @if (billType()) {
    <daily-fintech-recommendation-list
      [hasSpinner]="[]"
      (handleClick)="recommendationItemClick($event)"
      [billType]="billType()"
      [itemType]="RECOMMENDATION_TYPES.BILL"
      title="قبض‌های من"
    >
    </daily-fintech-recommendation-list>
  }
</div>
