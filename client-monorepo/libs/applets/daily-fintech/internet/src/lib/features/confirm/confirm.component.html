<common-ui-components-page-layout
  [stickyHeader]="true"
  title="خرید بسته اینترنت"
>
  @if (!isLoadingPage()) {
    <div class="page-content d-flex flex-column h-100">
      <payment-checkout-main
        [paymentCardData]="paymentCardData()"
        [appPayFeatureBody]="appPayFeatureBody()"
        [cachedTicket]="ticket()"
      ></payment-checkout-main>
    </div>
  }
</common-ui-components-page-layout>
