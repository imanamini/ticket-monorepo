<div class="body px-plus">
  <p class="b-2 text-onback-medium px-pony mb-medium">لطفا اطلاعات کارت بانکی خود را وارد کنید.</p>
  <div
    class="form d-flex flex-column"
    [formGroup]="form"
    id="c2c-card-data"
  >
    <div class="form-columns">
      <div class="col">
        <ui-form-field
          [errorMessageMapper]="{
            required: 'لطفا cvv2 را وارد کنید.',
          }"
          [formControlName]="'cvv2'"
          label="CVV2"
          [maxSize]="4"
          [inputType]="'masked'"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [autoComplete]="'off'"
          [error]="form.controls['cvv2'].errors"
        ></ui-form-field>
      </div>

      <div class="col">
        <ui-form-field
          [formControlName]="'expirationDate'"
          [label]="'تاریخ انقضا'"
          [type]="'date'"
          [dateRange]="'future'"
          [autoFocus]="autofocusDate()"
          [readonly]="true"
          [datePickerMode]="'bottomSheet'"
          [datePickerConfig]="{
            year: true,
            month: true,
            day: false,
            monthNumber: true,
          }"
        ></ui-form-field>
      </div>
    </div>

    <common-ui-dynamic-pass-field
      (countdownFinished)="dynamicPassCountdownFinished()"
      (sendButtonClicked)="sendDynamicPass()"
      [autofocus]="autoFocusPassword()"
      [countdownSeconds]="dynamicPassword.countdownSeconds"
      [enableSendButton]="dynamicPassword.enableSendButton"
      [inProgress]="dynamicPassword.gettingPassword"
      [parentForm]="form"
      [validationRules]="validationRules.password"
      [value]="form.value.password"
      controlName="password"
    ></common-ui-dynamic-pass-field>
    <ui-form-field
      [formControlName]="'message'"
      label="شرح تراکنش ( اختیاری)"
      [maxSize]="30"
      [inputType]="'text'"
      [error]="form.controls['message'].errors"
    >
    </ui-form-field>
  </div>
</div>
