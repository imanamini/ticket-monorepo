<common-ui-components-page-layout
  [stickyHeader]="true"
  [showBorder]="false"
  [showBackIcon]="true"
  [title]="'کارت به کارت'"
  [hasBackAction]="false"
  (onBackAction)="goBack()"
>
  <div
    class="body d-flex flex-column"
    id="credentials_card_c2c_v3"
  >
    <div class="content d-flex flex-column">
      <div class="w-100 pb-big pt-plus px-plus">
        <c2c-applet-c2c-transfer-summery
          [amount]="amount()"
          [destCardPan]="unifiedDestinationCardData()?.pan || ''"
          [destCardOwner]="unifiedDestinationCardData()?.cardOwner || ''"
          [destBankLogo]="unifiedDestinationCardData()?.bankLogoImageId || ''"
          [sourceCardPan]="unifiedSourceCardData()?.pan || ''"
          [sourceBankLogo]="unifiedSourceCardData()?.bankLogoImageId || ''"
        ></c2c-applet-c2c-transfer-summery>
      </div>
      <c2c-applet-c2c-card-credentials-form #cardCredentialsComponent> </c2c-applet-c2c-card-credentials-form>
      @if (!isFromFrequentTransaction()) {
        <div class="d-flex align-items-center surface-back p-medium mx-plus radius-minus gap-tiny">
          <common-icon-dp-icon
            [class]="'text-onback-high'"
            [icon]="'bookmark'"
            [iconSize]="'20'"
            iconType="linear"
          ></common-icon-dp-icon>
          <p class="b-3 text-onback-high flex-grow">افزودن کارت‌به‌کارت به لیست پرتکرارها</p>
          <ngx-switch
            [size]="24"
            [checked]="saveAsFrequentTransaction()"
            (checkedChange)="handleFrequentToggle($event)"
          ></ngx-switch>
        </div>
      }
    </div>

    <!-- Continue Button -->
    <div class="action px-plus pt-medium pb-huge">
      <ngx-button
        [brandButton]="true"
        (clickHandler)="handleTransfer()"
        [disabled]="form()?.invalid || isTransferring()"
        [isLoading]="isTransferring()"
        [fullWidth]="true"
      >
        انتقال
      </ngx-button>
    </div>
  </div>
</common-ui-components-page-layout>
