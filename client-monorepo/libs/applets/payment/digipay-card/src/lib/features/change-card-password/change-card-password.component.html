<common-ui-components-page-layout
  [showBorder]="true"
  bodyClasses="surface-back"
  headerClasses="surface-back"
  [title]="title()"
>
  <div class="h-100 p-plus d-flex flex-column pt-medium gap-big justify-content-space-between">
    <div class="d-flex flex-column gap-minus">
      <div class="st-8">اطلاعات کارت</div>
      <form [formGroup]="form">
        <ui-form-field
          [maxSize]="4"
          [convertNonEnglishDigits]="true"
          [showError]="'show'"
          [type]="'input'"
          [hasCleaner]="true"
          [type]="'input'"
          formControlName="currentPassword"
          [isNumericKeyboard]="true"
          [inputType]="'masked'"
          [label]="'رمز فعلی'"
          [required]="true"
          [error]="form.controls.currentPassword.errors"
          [errorMessageMapper]="errorMessageMapper"
        ></ui-form-field>
        <ui-form-field
          formControlName="newPassword"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [error]="form.controls.newPassword.errors"
          [inputType]="'masked'"
          [hasCleaner]="true"
          [maxSize]="4"
          [type]="'input'"
          [label]="'رمز جدید'"
          [required]="true"
          [errorMessageMapper]="errorMessageMapper"
        ></ui-form-field>
        <ui-form-field
          formControlName="newPasswordRepeat"
          [convertNonEnglishDigits]="true"
          [error]="form.controls.newPasswordRepeat.errors"
          [isNumericKeyboard]="true"
          [hasCleaner]="true"
          [maxSize]="4"
          [type]="'input'"
          [inputType]="'masked'"
          [label]="'تکرار رمز جدید'"
          [required]="true"
          [errorMessageMapper]="errorMessageMapper"
        ></ui-form-field>
      </form>
    </div>
    <div class="footer">
      <ngx-button
        [disabled]="form.invalid || loading()"
        [mode]="'form'"
        [size]="'large'"
        [style]="'fill'"
        [fullWidth]="true"
        (clickHandler)="submitForm()"
      >
        تغییر رمز
      </ngx-button>
    </div>
  </div>
</common-ui-components-page-layout>
