<!-- features/password/password-shell.component.html -->
<common-ui-components-page-layout
  [showBorder]="true"
  bodyClasses="surface-back"
  headerClasses="surface-back"
  [title]="config().title"
>
  <div class="h-100 p-plus d-flex flex-column pt-medium gap-big justify-content-space-between">
    <div class="d-flex flex-column gap-minus">
      <div class="st-8">اطلاعات کارت</div>

      <form [formGroup]="formGroup()">
        @if (config().showCvv2) {
          <ui-form-field
            formControlName="cvv2"
            [maxSize]="4"
            [type]="'input'"
            [inputType]="'masked'"
            [isNumericKeyboard]="true"
            [convertNonEnglishDigits]="true"
            [showError]="'show'"
            [hasCleaner]="true"
            [label]="config().labels.cvv2!"
            [required]="true"
            [error]="formGroup().controls['cvv2']?.errors"
            [errorMessageMapper]="{
              minlength: 'CVV2 حداقل 3 رقم باشد',
              maxlength: 'CVV2 حداکثر 4 رقم باشد'
            }"
          ></ui-form-field>
        }

        @if (config().showOldPassword) {
          <ui-form-field
            formControlName="oldPassword"
            [maxSize]="config().length"
            [type]="'input'"
            [inputType]="'masked'"
            [isNumericKeyboard]="true"
            [convertNonEnglishDigits]="true"
            [showError]="'show'"
            [hasCleaner]="true"
            [label]="config().labels.oldPassword!"
            [required]="true"
            [error]="formGroup().controls['oldPassword']?.errors"
            [errorMessageMapper]="config().errorMessageMapper"
          ></ui-form-field>
        }

        <ui-form-field
          formControlName="newPassword"
          [maxSize]="config().length"
          [type]="'input'"
          [inputType]="'masked'"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [showError]="'show'"
          [hasCleaner]="true"
          [label]="config().labels.newPassword"
          [required]="true"
          [error]="formGroup().controls['newPassword']?.errors"
          [errorMessageMapper]="config().errorMessageMapper"
        ></ui-form-field>

        <ui-form-field
          formControlName="confirmedNewPassword"
          [maxSize]="config().length"
          [type]="'input'"
          [inputType]="'masked'"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [showError]="'show'"
          [hasCleaner]="true"
          [label]="config().labels.confirmedNewPassword"
          [required]="true"
          [error]="formGroup().controls['confirmedNewPassword']?.errors"
          [errorMessageMapper]="config().errorMessageMapper"
        ></ui-form-field>
      </form>
    </div>

    <div class="footer">
      <ngx-button
        [disabled]="formGroup().invalid || loading()"
        [mode]="'form'"
        [size]="'large'"
        [style]="'fill'"
        [fullWidth]="true"
        (clickHandler)="submitForm()"
      >
        {{ config().submitCta }}
      </ngx-button>
    </div>
  </div>
</common-ui-components-page-layout>
