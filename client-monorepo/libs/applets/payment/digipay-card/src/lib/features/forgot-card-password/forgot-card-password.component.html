<common-ui-components-page-layout
  [showBorder]="true"
  bodyClasses="surface-back"
  headerClasses="surface-back"
  [title]="title()"
>
  <div class="h-100 p-plus d-flex flex-column pt-medium gap-big justify-content-space-between">
    <div class="d-flex flex-column gap-minus">
      <div class="st-8">اطلاعات کارت</div>
      <form [formGroup]="form">
        <ui-form-field
          [maxSize]="4"
          [type]="'input'"
          [inputType]="'masked'"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [showError]="'show'"
          [hasCleaner]="true"
          [error]="form.controls.cvv2.errors"
          [errorMessageMapper]="{
            minlength: 'CVV2 حداقل 3  رقم باشد باید',
            maxlength: 'CVV2 حداکثر باید ۴ رقم باشد.'
          }"
          formControlName="cvv2"
          [label]="'CVV2'"
          [required]="true"
        ></ui-form-field>
        <ui-form-field
          formControlName="password"
          [isNumericKeyboard]="true"
          [convertNonEnglishDigits]="true"
          [error]="form.controls.password.errors"
          [inputType]="'masked'"
          [type]="'input'"
          [hasCleaner]="true"
          [maxSize]="4"
          [label]="'رمز جدید'"
          [required]="true"
          [errorMessageMapper]="{
            minlength: 'رمز کارت باید 4  رقم باشد',
            maxlength: 'رمز کارت باید 4  رقم باشد',
            pattern: 'رمز کارت باید 4  رقم باشد'
          }"
        ></ui-form-field>
        <ui-form-field
          formControlName="passwordRepeat"
          [convertNonEnglishDigits]="true"
          [error]="form.controls.passwordRepeat.errors"
          [isNumericKeyboard]="true"
          [hasCleaner]="true"
          [maxSize]="4"
          [type]="'input'"
          [inputType]="'masked'"
          [label]="'تکرار رمز جدید'"
          [required]="true"
        ></ui-form-field>
      </form>
    </div>
    <div class="footer">
      <ngx-button
        [disabled]="form.invalid"
        [mode]="'form'"
        [size]="'large'"
        [style]="'fill'"
        [fullWidth]="true"
        (clickHandler)="submitForm()"
      >
        ادامه
      </ngx-button>
    </div>
  </div>
</common-ui-components-page-layout>
