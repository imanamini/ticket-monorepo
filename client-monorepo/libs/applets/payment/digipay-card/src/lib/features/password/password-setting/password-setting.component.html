<common-ui-components-page-layout
  [showBorder]="true"
  bodyClasses="surface-elevated"
  headerClasses="surface-elevated"
  [title]="'تنطیمات رمز'"
>
  <div class="h-100 px-plus py-pony pt-medium pt-medium d-flex flex-column gap-medium">
    <div class="d-flex flex-column gap-minus">
      <div class="st-8"> رمز اول (خرید حضوری)</div>
      <div class="d-flex flex-column surface-back radius-medium p-medium">
        <a
          [routerLink]="'/card/password/forgot/pin/' + id()"
          class="d-flex border-b-300 border-color-light py-minus cursor-pointer"
        >
          <common-icon-dp-icon
            [icon]="'history'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'text-onback-high'"
          ></common-icon-dp-icon>
          <span class="b-2 text-onback-medium mr-small">فراموشی رمز</span>
          <common-icon-dp-icon
            [icon]="'arrow-2-left'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'neutral-link mr-auto'"
          ></common-icon-dp-icon>
        </a>
        <a
          [routerLink]="'/card/password/change/pin/' + id()"
          class="d-flex py-minus cursor-pointer"
        >
          <common-icon-dp-icon
            [icon]="'lock'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'text-onback-high'"
          ></common-icon-dp-icon>
          <span class="b-2 text-onback-medium mr-small">تغییر رمز</span>
          <common-icon-dp-icon
            [icon]="'arrow-2-left'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'neutral-link mr-auto'"
          ></common-icon-dp-icon>
        </a>
      </div>
    </div>
    <div class="d-flex flex-column gap-minus">
      <div class="st-8"> رمز خرید آنلاین (ایستا)</div>
      <div class="d-flex flex-column surface-back radius-medium p-medium">
        <a
          [routerLink]="'/card/password/forgot/static/' + id()"
          class="d-flex border-b-300 border-color-light py-minus cursor-pointer"
        >
          <common-icon-dp-icon
            [icon]="'history'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'text-onback-high'"
          ></common-icon-dp-icon>
          <span class="b-2 text-onback-medium mr-small">فراموشی رمز</span>
          <common-icon-dp-icon
            [icon]="'arrow-2-left'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'neutral-link mr-auto'"
          ></common-icon-dp-icon>
        </a>
        <a
          [routerLink]="'/card/password/change/static/' + id()"
          class="d-flex py-minus cursor-pointer"
        >
          <common-icon-dp-icon
            [icon]="'lock'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'text-onback-high'"
          ></common-icon-dp-icon>
          <span class="b-2 text-onback-medium mr-small">تغییر رمز</span>
          <common-icon-dp-icon
            [icon]="'arrow-2-left'"
            [iconSize]="'24'"
            [iconType]="'linear'"
            [class]="'neutral-link mr-auto'"
          ></common-icon-dp-icon>
        </a>
      </div>
    </div>
  </div>
</common-ui-components-page-layout>
