<div
  class="recommendation-list-item"
  [ngClass]="{ 'is-clickable': clickable, 'is-pinned': item.pinned }"
  [ngStyle]="{ borderRightColor: convertItemColorToRgb() }"
  (click)="emitClick($event)"
>
  <div class="item-icon">
    <ui-api-image
      width="100%"
      height="100%"
      *ngIf="!imgLoadError && item.imageId"
      (loadError)="imageLoadError($event)"
      [imageId]="item.imageId"
      [styles]="{
        borderRadius: '50%',
        border: '1px solid #e5e5e5',
        padding: '2px',
        boxSizing: 'border-box',
      }"
    ></ui-api-image>
    <span
      *ngIf="imgLoadError || !item.imageId"
      class="image-placeholder"
    ></span>
  </div>
  <div class="item-text">
    <h4 class="item-title">{{ item.title }}</h4>
    <h5 class="item-info">
      {{ item.subTitle }}
    </h5>
  </div>
  <div
    class="item-action"
    *ngIf="showMore"
  >
    <a
      class="more"
      (click)="moreIconClick()"
    ></a>
  </div>
</div>
