<div class="detail d-flex justify-content-space-between p-medium radius-medium">
  <div class="d-flex flex-column justify-content-space-between">
    <span class="fs-14 fw-bold detail-text">موجودی قابل برداشت</span>
    <span class="fs-28 detail-text is-currency">{{ data()?.remainingCap ?? 0 | number }} ریال</span>

    <div class="d-flex justify-content-space-between">
      <span class="fs-12 detail-text">کل موجودی</span>
      <span class="fs-12 detail-text is-currency">{{ data()?.walletBalance ?? 0 | number }} ریال</span>
    </div>
  </div>
  <div class="d-flex flex-column gap-small">
    <cash-out-applet-remaining-chart
      [progress]="progress()"
      [radius]="radius()"
      [stroke]="stroke()"
    >
    </cash-out-applet-remaining-chart>

    <div class="d-flex flex-column text-align-center">
      <span class="fs-12 text-onback-low"> سقف برداشت روزانه </span>
      <span class="fs-12 text-onback-low is-currency"> {{ data()?.dailyCapAmount ?? 0 | number }} ریال </span>
    </div>
  </div>
</div>
