stages:
  - build
  - trigger

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
    - when: never

Trigger Client Monorepo:
  stage: trigger
  variables:
    TRIGGER_REFERER: "dpx"
  trigger:
    project: "frontend/monorepo/client-monorepo"
    branch: "$CI_COMMIT_BRANCH"
    forward:
      yaml_variables: true
  when: on_success
