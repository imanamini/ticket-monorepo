@if (!hasCredits()) {
  <ngx-callout
    [title]="'وام فعال ندارید'"
    [showTitleIcon]="true"
    [message]="'برای خرید از این فروشگاه‌ها باید وام دیجی‌پی را دریافت کنید.'"
    [cta]="'دریافت'"
    (ctaClick)="goToCreditPage()"
  ></ngx-callout>
}
<common-ui-components-services-or-stores-slider
  [items]="stores()"
  [imageType]="'logo'"
  [itemPerSlide]="hasCredits() ? 12 : 8"
  (indexChanged)="removeAllFaked()"
></common-ui-components-services-or-stores-slider>
