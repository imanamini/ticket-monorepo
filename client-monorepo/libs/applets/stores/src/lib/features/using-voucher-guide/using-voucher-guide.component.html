<div class="d-flex flex-column surface-onback h-100">
  <ngx-app-bar
    [title]="'کدتخفیف درگاه دیجی‌پی'"
    [rightButton]="{
      icon: 'arrow-right',
      style: 'link',
      mode: 'icon-only',
      size: 'medium',
    }"
    (onRightButtonClick)="goBack()"
  ></ngx-app-bar>
  <div class="d-flex flex-column gap-big px-plus">
    <div class="gif-wrapper w-100">
      <img
        class="voucher-gif"
        src="assets/shared/stores/voucher-guide.gif"
        alt=""
      />
    </div>
    <div class="d-flex flex-column gap-low">
      <!-- Title -->
      <div class="d-flex justify-content-start align-items-center gap-micro">
        <ngx-icon
          [iconSize]="'24px'"
          [type]="'linear'"
          [name]="'shopping-bag'"
        ></ngx-icon>
        <div class="st-6 text-onback-high">راهنمای استفاده از کدتخفیف درگاه دیجی‌پی</div>
      </div>
      <!-- End Title -->

      <!-- Callout -->
      <ngx-callout
        class="shopping-guide-callout"
        [mode]="'multiple'"
        [messages]="calloutMessages"
        [showTitleBlink]="false"
        [showTitleIcon]="false"
        [title]="''"
        [backgroundMode]="'elevated'"
      ></ngx-callout>
      <!-- End Callout -->
      <div class="p-medium"></div>
    </div>
  </div>
</div>
